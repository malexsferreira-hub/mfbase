services:
  - type: web
    name: mfbase
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mfbase-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: mfbase-db
    plan: free
    databaseName: mfbase
    user: mfbase
