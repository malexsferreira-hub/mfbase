<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MF Base</title>
<meta name="theme-color" content="#F7F5EF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MF Base">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-32.png" type="image/png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOUCHLINE — design tokens
   ============================================================ */
:root{
  --bg:#F7F5EF;
  --surface:#FFFFFF;
  --surface-2:#F1ECE0;
  --surface-3:#E7DFCC;
  --border:#DDD3B8;
  --border-strong:#C7B98F;
  --text:#18150E;
  --text-muted:#6B6252;
  --text-faint:#9C927E;
  --accent:#A9791C;
  --accent-strong:#87600F;
  --accent-soft:#F1E3BE;
  --on-accent:#FFFFFF;
  --gold:#A9791C;
  --gold-soft:#F1E3BE;
  --silver:#6E7480;
  --silver-soft:#E7E9ED;
  --interest:#A3391C;
  --interest-soft:#F6E0D6;
  --blue:#2A5C8A;
  --blue-soft:#E1EBF4;
  --green:#2E7D4F;
  --green-soft:#DFF0E5;
  --danger:#B3261E;
  --danger-soft:#F8DEDB;
  --brown:#6B4423;
  --brown-soft:#EDE1D3;
  /* Performance (1-5) / Potential (E-A) rating scale: red -> orange -> yellow -> light green -> vivid green. */
  --rate-1:#C13B2E;
  --rate-2:#D9822B;
  --rate-3:#C9A014;
  --rate-4:#6FAE4F;
  --rate-5:#28914B;
  --rate-blue:#4A90D9;
  --shadow:0 1px 2px rgba(20,17,10,.06), 0 6px 20px -8px rgba(20,17,10,.12);
  --radius:10px;
  --radius-sm:7px;
  --font-display:'Big Shoulders Display',system-ui,sans-serif;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
/* App is deliberately light-only (white background, gold accent) regardless of
   the device's system color-scheme preference — dark mode read as illegible. */
:root[data-theme="dark"]{
  --bg:#0A0A0A;
  --surface:#141412;
  --surface-2:#1C1B18;
  --surface-3:#28261F;
  --border:#332F26;
  --border-strong:#4A4535;
  --text:#F3F0E6;
  --text-muted:#ACA592;
  --text-faint:#726C5A;
  --accent:#D3A94A;
  --accent-strong:#EAC978;
  --accent-soft:#2C2413;
  --on-accent:#1B1404;
  --gold:#D3A94A;
  --gold-soft:#2C2413;
  --silver:#B8BCC4;
  --silver-soft:#22242A;
  --interest:#E8845C;
  --interest-soft:#33231A;
  --blue:#7FB0E0;
  --blue-soft:#16222E;
  --green:#7BC79A;
  --green-soft:#12261A;
  --danger:#F0857D;
  --danger-soft:#301813;
  --brown:#C9A06B;
  --brown-soft:#2C2419;
  --rate-1:#F0665A;
  --rate-2:#F0A45C;
  --rate-3:#E8D25C;
  --rate-4:#8FD46B;
  --rate-5:#4CD671;
  --rate-blue:#7EC3F0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;color-scheme:light;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;color:var(--text);}
a{color:inherit;text-decoration:none;}
/* Safari/WebKit renders buttons, selects and inputs with native OS chrome (often
   dark-on-dark) unless appearance is reset — this keeps our own colors everywhere. */
button,select{-webkit-appearance:none;-moz-appearance:none;appearance:none;}
button{font-family:inherit;color:inherit;background:none;border:none;}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--surface);}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23767566' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:14px;padding-right:26px;}
::selection{background:var(--accent-soft);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

/* ---------- layout shell ---------- */
#app{min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:222px;flex:0 0 222px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;}
.brand-mark{width:38px;height:38px;border-radius:50%;flex:0 0 auto;object-fit:cover;box-shadow:0 0 0 1px var(--border-strong);}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.03em;line-height:1;}
.brand-name .f{color:var(--gold);}
.brand-sub{font-size:10px;color:var(--silver);text-transform:uppercase;letter-spacing:.13em;margin-top:3px;}
.nav-primary{display:flex;flex-direction:column;gap:8px;padding:4px 10px 14px;}
.nav-primary-btn{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--radius-sm);font-weight:700;font-size:13.5px;border:1px solid transparent;box-shadow:var(--shadow);}
.nav-primary-btn svg{width:18px;height:18px;flex:0 0 auto;}
.nav-primary-btn.primary{background:var(--accent);color:var(--on-accent);}
.nav-primary-btn.primary:hover{background:var(--accent-strong);}
.nav-primary-btn.secondary{background:var(--surface-2);border-color:var(--border-strong);color:var(--text);}
.nav-primary-btn.secondary:hover{background:var(--surface-3);}
.nav-primary-btn.active{box-shadow:0 0 0 2px var(--gold) inset;}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px;flex:1;overflow-y:auto;}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-muted);font-weight:600;font-size:13.5px;}
.nav-link svg{width:18px;height:18px;flex:0 0 auto;}
.nav-link:hover{background:var(--surface-2);color:var(--text);}
.nav-link.active{background:var(--accent-soft);color:var(--accent-strong);}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);padding:14px 12px 4px;}
.nav-future{opacity:.45;cursor:default;}
.nav-future:hover{background:none;color:var(--text-muted);}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);}
.sync-offline-badge{display:inline-flex;align-items:center;gap:4px;background:#fbe4e1;color:#a3372c;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:4px 9px;border-radius:99px;}
.sync-offline-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#c0392b;}
.scout-chip{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);}
.scout-avatar{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--text-muted);flex:0 0 auto;}
.scout-name{font-size:12.5px;font-weight:600;}
.scout-role{font-size:10.5px;color:var(--text-faint);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:none;}
.search-wrap{position:relative;flex:1;max-width:420px;}
.search-input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:99px;background:var(--surface);font-size:13.5px;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);width:15px;height:15px;pointer-events:none;}
.search-results{position:relative;background:var(--surface);max-height:60vh;overflow-y:auto;z-index:30;margin-top:10px;}
.search-results.empty{display:none;}
.sr-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:9px 12px 4px;}
.sr-item{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;border-radius:var(--radius-sm);}
.sr-item:hover{background:var(--surface-2);}
.sr-item-sub{font-size:11.5px;color:var(--text-muted);}
.topbar-actions{display:flex;gap:8px;margin-left:auto;flex:0 0 auto;}
.search-trigger-btn{margin-left:auto;flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.search-trigger-btn:hover{background:var(--surface-2);color:var(--text);}
.page-title-mobile{display:none;font-family:var(--font-display);font-weight:700;font-size:19px;}
.content{flex:1;padding:22px;max-width:1280px;width:100%;margin:0 auto;padding-bottom:64px;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;min-height:38px;line-height:1;}
.btn svg{width:15px;height:15px;}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-danger{color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 10px;font-size:12.5px;min-height:30px;}
.btn-icon{padding:8px;min-width:38px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.fab{display:none;}

/* ---------- cards / sections ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:18px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.section-title{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.01em;}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);font-weight:700;}
.stack{display:flex;flex-direction:column;gap:14px;}
.grid{display:grid;gap:14px;}
.grid > *{min-width:0;}
.rating-grid{grid-template-columns:1fr 1fr;}
.eval-param-grid{grid-template-columns:1fr 1fr 1fr;}
.eval-param-card{padding:12px 14px;}
.eval-param-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;}
.eval-param-label{font-size:11.5px;color:var(--text-muted);flex:1;min-width:0;}
input.eval-param-input{width:44px;min-height:28px;padding:2px 4px;text-align:center;font-size:12.5px;flex:0 0 auto;}
.eval-param-comment{min-height:46px;font-size:12px;margin-top:8px;padding:6px 8px;}
@media (max-width:1100px){ .eval-param-grid{grid-template-columns:1fr;} }
.hr{height:1px;background:var(--border);border:0;margin:16px 0;}

/* ---------- stat tiles ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;}
.dash-grid{grid-template-columns:1.3fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(2,auto);align-items:start;}
.dash-header-actions{display:flex;gap:8px;flex:0 0 auto;}
.dash-match-agegroup{display:none!important;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;}
.stat-value{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;}
.stat-label{font-size:11.5px;color:var(--text-muted);margin-top:5px;font-weight:600;}

/* ---------- dashboard: single-day agenda strip (yesterday/today/tomorrow/day-after-tomorrow) ----------
   Same one-day-at-a-time view with prev/next arrows on both desktop and mobile — this widget is
   the Dashboard's own mini-agenda only; the full Agenda page (#/agenda) is unrelated and unchanged. */
.dash-agenda-item{display:flex;align-items:center;gap:5px;padding:3px 2px;}
.dash-agenda-empty{padding:4px 2px;color:var(--text-faint);font-size:11px;}
.dash-agenda-agegroup{display:none!important;}
.dash-day-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.dash-day-nav-label{font-size:12.5px;font-weight:700;color:var(--text);}
.icon-btn:disabled{opacity:.3;cursor:default;}

/* ---------- dashboard: notes scratchpad ---------- */
.dash-notes-card{display:flex;flex-direction:column;}
.dash-notes-textarea{min-height:190px;}

/* ---------- badges / pills ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1.6;}
.badge-select{border:none;padding:3px 20px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10'><path d='M1 3l4 4 4-4' stroke='%23888' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 6px center;}
.badge-pos{background:var(--surface-3);color:var(--text);font-family:var(--font-mono);font-weight:600;}
.badge-posgrp-GK{background:var(--gold-soft);color:var(--gold);}
.badge-posgrp-DEF{background:var(--blue-soft);color:var(--blue);}
.badge-posgrp-MID{background:var(--green-soft);color:var(--green);}
.badge-posgrp-FWD{background:var(--danger-soft);color:var(--danger);}
.badge-pos-lg{font-size:13px;padding:5px 12px;font-weight:700;letter-spacing:0.03em;}
.pos-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-right:2px;}
.pos-dot-GK{background:var(--gold);}
.pos-dot-DEF{background:var(--blue);}
.pos-dot-MID{background:var(--green);}
.pos-dot-FWD{background:var(--danger);}
.badge-mode-LIVE{background:var(--danger-soft);color:var(--danger);}
.badge-mode-VIDEO{background:var(--green-soft);color:var(--green);}
.badge-mode-TV{background:var(--blue-soft);color:var(--blue);}
.badge-status-To-Watch{background:var(--blue-soft);color:var(--blue);}
.badge-status-Scheduled{background:var(--surface-3);color:var(--text-muted);}
.badge-status-Watched{background:var(--accent-soft);color:var(--accent-strong);}
.badge-status-Partially-Watched{background:var(--gold-soft);color:var(--gold);}
.badge-status-Cancelled{background:var(--danger-soft);color:var(--danger);}
.badge-rec-High-Interest{background:var(--gold-soft);color:var(--gold);}
.badge-rec-Interest{background:var(--accent-soft);color:var(--accent-strong);}
.badge-rec-Monitor{background:var(--blue-soft);color:var(--blue);}
.badge-rec-Continue-Monitoring{background:var(--blue-soft);color:var(--blue);}
.badge-rec-No-Interest{background:var(--danger-soft);color:var(--danger);}
.badge-rec-Not-Enough-Information{background:var(--surface-3);color:var(--text-muted);}
.badge-type-Match{background:var(--accent-soft);color:var(--accent-strong);}
.badge-type-Manual{background:var(--surface-3);color:var(--text-muted);}
.badge-type-LiveMatch{background:var(--danger-soft);color:var(--danger);}
.badge-type-TVMatch{background:var(--blue-soft);color:var(--blue);}
.badge-type-VideoMatch{background:var(--green-soft);color:var(--green);}
.badge-type-Highlights{background:var(--gold-soft);color:var(--gold);}
.badge-type-Training{background:var(--silver-soft);color:var(--silver);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ---------- avatars / crests ---------- */
.avatar{border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--surface-3);}
.avatar-fallback{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;flex:0 0 auto;}
.crest{border-radius:6px;object-fit:cover;flex:0 0 auto;background:var(--surface-3);}
.crest-fallback{border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;flex:0 0 auto;font-size:10px;}

/* ---------- rating indicators ---------- */
.rating-ring{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.rating-ring svg{transform:rotate(-90deg);}
.rating-ring-num{position:absolute;font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;}
.rating-bar-track{background:var(--surface-3);border-radius:99px;height:6px;overflow:hidden;flex:1;}
.rating-bar-fill{height:100%;border-radius:99px;}
.rating-row{display:flex;align-items:center;gap:8px;}
.rating-num-sm{font-family:var(--font-mono);font-weight:600;font-size:12.5px;width:30px;text-align:right;flex:0 0 auto;}
.grade-chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;border:1.5px solid currentColor;font-family:var(--font-mono);font-weight:700;font-size:12.5px;flex:0 0 auto;}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--text);}
thead th.sorted{color:var(--accent-strong);}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:0;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:var(--surface-2);}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.table-empty{padding:36px 20px;text-align:center;color:var(--text-muted);}
.table-compact thead th{padding:6px 10px;}
.table-compact tbody td{padding:5px 10px;}
.table-compact thead th,.table-compact tbody td,.table-matches thead th,.table-matches tbody td,.table-evalhist thead th,.table-evalhist tbody td{text-align:center;}
.table-compact td.num,.table-compact th.num,.table-matches td.num,.table-matches th.num,.table-evalhist td.num,.table-evalhist th.num{text-align:center;}
.table-compact .rating-row,.table-matches .rating-row,.table-evalhist .rating-row{justify-content:center;}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.field-label .opt{text-transform:none;font-weight:500;color:var(--text-faint);letter-spacing:0;}
.input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);min-height:44px;}
.textarea{min-height:80px;resize:vertical;font-family:inherit;line-height:1.5;}
.backup-textarea{height:280px;font-family:monospace;font-size:11px;line-height:1.4;white-space:pre;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .span2{grid-column:1/-1;}
/* Number+Name on the pitch-slot modal: always stacked, one per line (Number first, then Name),
   on both desktop and mobile/iPhone. */
.namenum-row{display:grid;grid-template-columns:1fr;gap:14px;}
.field-checkbox{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);}
.field-checkbox input[type="checkbox"]{width:17px;height:17px;accent-color:var(--gold);cursor:pointer;flex:0 0 auto;}
.field-checkbox svg{width:15px;height:15px;color:var(--gold);flex:0 0 auto;}
.pillgroup{display:flex;gap:6px;flex-wrap:wrap;}
.pill-opt{padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:12.5px;cursor:pointer;min-height:38px;}
.pill-opt.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.field-hint{font-size:11.5px;color:var(--text-faint);}
.save-inline{display:none;margin-top:6px;}
.save-inline.show{display:inline-flex;}
.autosaved-tick{font-size:11.5px;color:var(--accent);font-weight:600;display:none;align-items:center;gap:4px;}
.autosaved-tick.show{display:inline-flex;}

/* ---------- club/player combobox ---------- */
.combo{position:relative;}
.combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:40;max-height:280px;overflow-y:auto;}
.combo-item{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;}
.combo-item:hover,.combo-item.hi{background:var(--surface-2);}
.combo-item-sub{font-size:11px;color:var(--text-muted);}
.combo-create{padding:9px 11px;cursor:pointer;color:var(--accent);font-weight:700;border-top:1px solid var(--border);}
.combo-create:hover{background:var(--accent-soft);}

/* ---------- lineup ---------- */
.lineup-col-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.lineup-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.lineup-cols > .card{min-width:0;}
.quickadd{min-width:0;}
.roster-group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);padding:10px 4px 6px;}
.roster-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:var(--radius-sm);border:1px solid transparent;}
.roster-row:hover{background:var(--surface-2);}
.shirt-num{font-family:var(--font-display);font-weight:800;font-size:19px;width:30px;text-align:center;color:var(--text-muted);flex:0 0 auto;}
.roster-pos-select{min-height:22px;padding:1px 6px;font-size:10.5px;width:auto;max-width:110px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border);color:var(--text-muted);font-weight:700;}
.roster-name-wrap{flex:1;min-width:0;}
.roster-name{font-weight:700;font-size:13.5px;}
.roster-chars{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.roster-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto;}

/* ---------- 4-3-3 pitch formation ---------- */
.pitch-wrap{margin:10px 0 14px;}
.pitch{position:relative;width:100%;aspect-ratio:2/3;max-height:420px;border-radius:10px;overflow:hidden;border:1px solid var(--border);
  background-color:#1f6236;
  background-image:repeating-linear-gradient(180deg,#1f6236 0,#1f6236 10%,#256e3d 10%,#256e3d 20%);}
.pitch-line{position:absolute;box-sizing:border-box;}
.pitch-halfway{left:0;right:0;top:50%;height:0;border-top:2px solid rgba(255,255,255,.32);}
.pitch-circle{width:22%;aspect-ratio:1/1;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.32);border-radius:50%;}
.pitch-box{left:50%;width:48%;transform:translateX(-50%);height:13%;border:2px solid rgba(255,255,255,.32);}
.pitch-box-top{top:0;border-top:none;}
.pitch-box-bottom{bottom:0;border-bottom:none;}
.pitch-slot-stack{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;}
.pitch-jersey{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background:none;border:none;padding:0;-webkit-tap-highlight-color:transparent;}
.pitch-jersey-num{position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px 8px 2px 2px;background:var(--gold);color:#1a1300;font-family:var(--font-display);font-weight:800;font-size:13.5px;box-shadow:0 1px 4px rgba(0,0,0,.45);}
.pitch-jersey-num svg{width:16px;height:16px;}
.pitch-jersey-info-mark{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#fff;color:#1a1300;font-size:11px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.5);}
.pitch-jersey-star-mark{background:var(--gold);}
.pitch-jersey-star-mark svg{width:9px;height:9px;display:block;color:#fff;}
.pitch-jersey-off-mark{position:absolute;bottom:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--danger);color:#fff;font-size:9px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.5);}
.pitch-jersey-name{font-size:9.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:68px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pitch-empty .pitch-jersey-num{background:rgba(255,255,255,.14);color:#fff;border:1.5px dashed rgba(255,255,255,.5);box-shadow:none;}
.pitch-empty .pitch-jersey-name{color:rgba(255,255,255,.7);}
.pitch-jersey-sub .pitch-jersey-num{width:26px;height:26px;background:var(--blue);color:#0c1a26;border-radius:6px 6px 2px 2px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.45);}
.pitch-add-sub{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.16);border:1.5px dashed rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;}
.pitch-add-sub svg{width:11px;height:11px;}

/* ---------- agenda month-grid calendar ---------- */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.cal-nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:99px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);flex:0 0 auto;}
.cal-nav-btn svg{width:16px;height:16px;}
.cal-grid-wrap{overflow-x:auto;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));min-width:740px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-grid-head{background:var(--surface-2);padding:8px 6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);text-align:center;border-bottom:1px solid var(--border);}
.cal-cell{background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;}
.cal-cell.out-month{background:var(--surface-2);}
.cal-cell.out-month .cal-cell-date{color:var(--text-faint);}
.cal-cell.today{background:var(--gold-soft);}
.cal-cell-date{font-size:11px;font-weight:700;color:var(--text-muted);}
.cal-cell.today .cal-cell-date{color:var(--gold);}
.cal-cell-date-btn{background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:transparent;-webkit-tap-highlight-color:transparent;}
.cal-cell-date-btn:hover, .cal-cell-date-btn:focus{text-decoration-color:currentColor;}
.cal-cell-more{background:none;border:none;padding:0 2px;margin:0;cursor:pointer;color:var(--accent);font-size:10.5px;font-weight:700;text-align:left;-webkit-tap-highlight-color:transparent;}
.cal-chip{display:block;padding:2px 6px;border-radius:6px;font-size:10.5px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-decoration:none;}
.cal-chip-match{background:var(--interest-soft);color:var(--interest);}
.cal-chip-mode-LIVE{background:var(--danger-soft);color:var(--danger);}
.cal-chip-mode-VIDEO{background:var(--green-soft);color:var(--green);}
.cal-chip-mode-TV{background:var(--blue-soft);color:var(--blue);}
.cal-chip-match-watched{background:var(--accent-soft);color:var(--accent-strong);}
.cal-chip-task{background:var(--brown-soft);color:var(--brown);}
.cal-chip-task.done{background:var(--silver-soft);color:var(--silver);text-decoration:line-through;opacity:.85;}
.cal-cell-add{margin-top:auto;align-self:flex-start;background:none;border:1px dashed var(--border);border-radius:6px;padding:1px 5px;cursor:pointer;color:var(--text-faint);display:flex;align-items:center;}
.cal-cell-add svg{width:11px;height:11px;}
.star-btn{background:none;border:0;cursor:pointer;font-size:18px;color:var(--border-strong);padding:6px;line-height:1;}
.star-btn.on{color:var(--gold);}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--text-faint);padding:6px;border-radius:6px;display:flex;}
.icon-btn:hover{background:var(--surface-3);color:var(--text);}
.icon-btn svg{width:15px;height:15px;}
.quickadd{display:flex;gap:8px;padding:9px 8px;align-items:flex-end;flex-wrap:wrap;}
.quickadd .qa-num{width:56px;}
.quickadd .qa-name{flex:1;min-width:130px;}
.quickadd .qa-chars{flex:1.4;min-width:150px;}
.quickadd input{min-height:42px;padding:9px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);}
.addplayer-toggle{width:100%;text-align:left;padding:11px 12px;border-radius:var(--radius-sm);border:1px dashed var(--border-strong);background:transparent;color:var(--text-muted);font-weight:700;font-size:13px;cursor:pointer;margin-top:6px;min-height:44px;}
.addplayer-toggle:hover{background:var(--surface-2);color:var(--text);}
.addplayer-toggle svg{width:14px;height:14px;vertical-align:-2px;margin-right:2px;}

/* ---------- accordion (details) ---------- */
details.acc{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;}
details.acc + details.acc{margin-top:10px;}
details.acc summary{list-style:none;padding:13px 15px;font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;}
details.acc summary::-webkit-details-marker{display:none;}
details.acc summary .chev{transition:transform .15s;color:var(--text-faint);width:16px;height:16px;flex:0 0 auto;}
details.acc summary{gap:0;}
details.acc summary > svg:first-child{width:17px;height:17px;flex:0 0 auto;color:var(--text-muted);}
details.acc[open] summary .chev{transform:rotate(90deg);}
details.acc summary .count-chip{background:var(--surface-3);color:var(--text-muted);border-radius:99px;padding:2px 9px;font-size:11.5px;font-family:var(--font-mono);margin-right:auto;margin-left:8px;}
.acc-body{padding:0 15px 15px;border-top:1px solid var(--border);}

/* ---------- modal / sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,15,11,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal-pad{padding:20px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:18px;}
.candidate-card{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:9px;cursor:pointer;}
.candidate-card:hover{border-color:var(--accent);background:var(--accent-soft);}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;}
.toast.show{opacity:1;transform:translateY(0);}

/* ---------- sparkline ---------- */
.spark-wrap{display:flex;gap:18px;flex-wrap:wrap;}
.spark-block{flex:1;min-width:180px;}

/* ---------- empty state ---------- */
.empty-state{text-align:center;padding:46px 20px;color:var(--text-muted);}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--text);}
.empty-state p{margin:0 0 14px;font-size:13px;}

/* ---------- filter bar ---------- */
.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:14px;}
.filterbar select,.filterbar input{padding:10px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:14px;min-height:44px;max-width:100%;}
.filterbar select{max-width:220px;}
.filter-toggle{padding:10px 18px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;min-height:44px;}
.filter-toggle.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
.back-link{font-size:12.5px;color:var(--text-muted);font-weight:600;cursor:pointer;padding:0;text-align:left;}
.msf{position:relative;}
.msf-panel{position:absolute;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:40;min-width:200px;max-width:280px;max-height:320px;overflow-y:auto;padding:6px;}
.msf-opt{display:flex;align-items:center;gap:8px;padding:9px 8px;font-size:13.5px;cursor:pointer;border-radius:6px;}
.msf-opt:hover{background:var(--surface-2);}
.msf-opt input{flex:0 0 auto;width:15px;height:15px;}
.msf-clear-btn{width:100%;margin-top:4px;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);font-size:11.5px;font-weight:600;cursor:pointer;color:var(--text-muted);}
.msf-empty{padding:8px 6px;font-size:12px;color:var(--text-faint);}

/* ---------- profile header ---------- */
.profile-head{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap;}
.profile-info{min-width:0;}
.profile-info h1{font-size:27px;}
.profile-pos-heading{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.profile-name-under-photo{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text);text-align:center;max-width:140px;line-height:1.15;}
.profile-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;align-items:center;}
.profile-club{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);font-weight:600;max-width:260px;overflow-wrap:break-word;}
.profile-club b{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;}
.profile-club-country{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;margin-top:3px;text-align:center;}
.profile-club.inline-edit,.profile-club .inline-edit{cursor:text;border-bottom:1px dashed var(--border-strong);padding-bottom:1px;}
.profile-club.inline-edit:hover,.profile-club .inline-edit:hover{color:var(--text);border-color:var(--accent);}
.profile-club.inline-edit input.input,.profile-club .inline-edit input.input{margin-left:2px;}
.inline-select{border:none;background:transparent;font:inherit;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:1px dashed var(--border-strong);padding:0 0 1px;-webkit-appearance:none;appearance:none;}
.inline-select:hover{color:var(--text);border-color:var(--accent);}
.profile-photo-btn{position:relative;cursor:pointer;display:inline-block;}
.profile-photo-btn:hover .profile-photo-overlay{opacity:1;}
.profile-photo-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;font-size:11px;font-weight:700;text-align:center;}
.profile-photo-badge{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);box-shadow:var(--shadow);pointer-events:none;}
.profile-photo-badge svg{width:13px;height:13px;}
.profile-photo-input-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:50%;margin:0;padding:0;}
.profile-pos-row{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px;}
.profile-photo-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 auto;}
.profile-side-col{display:flex;flex-direction:column;align-items:center;gap:12px;flex:0 0 auto;}
.profile-side-actions{display:flex;gap:8px;align-items:center;justify-content:center;}
.profile-side-stack{display:flex;gap:20px;flex:0 0 auto;align-items:center;justify-content:center;}
.profile-side-stack.profile-clubnat-stack{align-items:flex-start;}
.profile-side-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:56px;}
.profile-side-icon{display:flex;align-items:center;justify-content:center;height:52px;position:relative;}
.profile-side-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;}
.profile-side-value{font-size:12.5px;font-weight:600;color:var(--text-muted);max-width:110px;text-align:center;}
.profile-side-value .inline-select{font-size:12.5px;text-align:center;text-align-last:center;}
.profile-club-select-value{position:relative;cursor:pointer;border-bottom:1px dashed var(--border-strong);}
.profile-club-select-value:hover{color:var(--text);border-color:var(--accent);}
/* Pulls the club-country line up closer to the club name, in line with the "+2nd nat." line's
   tight, same-block spacing on the nationality item next to it. */
.profile-side-item .profile-club-country{margin-top:-3px;}
.flag-emoji-lg{font-size:32px;line-height:1;}
.profile-ring-editable{cursor:pointer;}
.ring-select-overlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border-radius:50%;}
.profile-divider-left{border-left:1px solid var(--border);padding-left:16px;}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.kv-item .kv-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin-bottom:3px;}
.kv-item .kv-val{font-size:13.5px;font-weight:600;}

/* ---------- match header ---------- */
.match-head{text-align:center;padding:6px 0 4px;}
.match-head-teams{display:flex;align-items:center;justify-content:center;gap:22px;}
.match-head-team{display:flex;flex-direction:column;align-items:center;gap:8px;width:150px;}
.match-head-team .name{font-weight:700;font-size:14px;text-align:center;}
.match-head-vs{font-family:var(--font-display);color:var(--text-faint);font-size:16px;font-weight:700;}
.match-head-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}

/* ---------- tabs (mobile nav) ---------- */
.tabbar{display:none;}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .sidebar{display:none;}
  .content{padding:14px;padding-bottom:88px;}
  .topbar{display:flex;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);align-items:center;gap:8px;padding:10px 14px;backdrop-filter:blur(6px);}
  .page-title-mobile{display:block;}
  .lineup-cols{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none;}
  .dash-col-agenda{order:1;}
  .dash-col-notes{order:2;}
  .dash-col-matches{order:3;}
  .dash-col-poi{order:4;}
  .dash-match-crests{display:none!important;}
  .dash-match-agegroup{display:inline-flex!important;}
  .dash-match-competition{display:none!important;}
  .dash-agenda-agegroup{display:inline-flex!important;}
  .dash-agenda-competition{display:none!important;}
  .rating-grid{grid-template-columns:1fr;}
  .kv-grid{grid-template-columns:repeat(2,1fr);}
  .profile-head{flex-direction:column;align-items:center;text-align:center;}
  .profile-meta{justify-content:center;}
  .profile-pos-heading{justify-content:center;}
  .profile-divider-left{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:14px;}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--text-faint);font-size:10px;font-weight:700;border-radius:8px;}
  .tab-item svg{width:20px;height:20px;}
  .tab-item.active{color:var(--accent);}
  .tab-item.fab-item{position:relative;top:-14px;}
  .tab-item.fab-item .fab-circle{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);margin-bottom:2px;}
  .tab-item.fab-item svg{width:22px;height:22px;}
  .tab-item-brand img{width:20px;height:20px;border-radius:5px;object-fit:cover;}
  body{padding-bottom:0;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .match-head-team{width:110px;}
  .search-wrap{max-width:none;}
  .topbar-actions .btn-label{display:none;}
  .dash-header-actions{display:none;}
  /* Filter bars (Matches/Players Database): smaller pills, tighter gaps, wrapping into
     compact rows below the search box instead of sprawling across the page. */
  .filterbar{justify-content:flex-start;gap:5px;}
  .filter-toggle{padding:5px 9px;font-size:11px;min-height:28px;}
  #mf_q,#pf_q{width:100%!important;}

var SERVER_SYNC = "unknown"; // "ok" | "offline" | "unknown" — surfaced in the UI so a failed save is never silent
var LAST_SYNCED_UPDATED_AT = null;

// Loads the database from the server (the real, shared, cross-device source of truth). Falls back
// to a local cached copy only if the network request itself fails outright (e.g. briefly offline),
// so the app can still open in a degraded, local-only state rather than showing a blank page.
async function loadInitialData(){
  var fallbackSeed = {schemaVersion:1,scouts:[{id:"scout-1",name:"Miguel Ferreira",email:"m.alexsferreira@gmail.com",role:"Scout"}],currentScoutId:"scout-1",clubs:[],players:[],matches:[],matchPlayers:[],evaluations:[],playerNotes:[],fixtures:[],agendaTasks:[],dashboardNote:""};
  var seed = null;
  try{
    var res = await fetch("/api/db",{cache:"no-store",credentials:"same-origin"});
    if(res.status===401){ location.href="/login"; return fallbackSeed; }
    if(!res.ok) throw new Error("GET /api/db failed: "+res.status);
    var body = await res.json();
    if(body && body.data && typeof body.data==="object"){
      seed = body.data;
      LAST_SYNCED_UPDATED_AT = body.updatedAt || null;
      SERVER_SYNC = "ok";
      try{ localStorage.setItem("touchline-db-cache", JSON.stringify(seed)); }catch(e){}
    }
  }catch(e){
    console.warn("MF Base: could not reach the server, opening from local cache (read-only until back online).", e);
    SERVER_SYNC = "offline";
    try{
      var local = localStorage.getItem("touchline-db-cache");
      if(local){ var lp = JSON.parse(local); if(lp && lp.schemaVersion) seed = lp; }
    }catch(e2){}
  }
  if(!seed) seed = fallbackSeed;
  seed.scouts = seed.scouts && seed.scouts.length ? seed.scouts : [{id:"scout-1",name:"Miguel Ferreira",email:"m.alexsferreira@gmail.com",role:"Scout"}];
  seed.currentScoutId = seed.currentScoutId || seed.scouts[0].id;
  seed.clubs = seed.clubs || [];
  seed.players = seed.players || [];
  seed.matches = seed.matches || [];
  seed.matchPlayers = seed.matchPlayers || [];
  seed.evaluations = seed.evaluations || [];
  seed.playerNotes = seed.playerNotes || [];
  seed.fixtures = seed.fixtures || [];
  seed.agendaTasks = seed.agendaTasks || [];
  // dashboardNote replaced the earlier per-item quickNotes list with a single freeform
  // scratchpad; fold over any quickNotes text so nothing typed there is lost.
  if(seed.dashboardNote===undefined || seed.dashboardNote===null){
    seed.dashboardNote = (seed.quickNotes||[]).map(function(n){return n.text;}).filter(Boolean).join("\n");
  }
  delete seed.quickNotes;
  seed.competitionCountries = seed.competitionCountries || {};
  return seed;
}

function ageFromPlayer(p){
  var y=null,m=0,d=1;
  if(p.dob){
    var parts=p.dob.split("-");
    y=parseInt(parts[0],10); m=parseInt(parts[1],10)-1; d=parseInt(parts[2],10);
  } else if(p.birthYear){
    y=parseInt(p.birthYear,10);
  }
  if(!y||isNaN(y)) return null;
  var today=new Date();
  var birth=new Date(y,m,d);
  var age=today.getFullYear()-birth.getFullYear();
  var mDiff=today.getMonth()-birth.getMonth();
  if(mDiff<0 || (mDiff===0 && today.getDate()<birth.getDate())) age--;
  return age;

function levenshtein(a,b){
  a=a||""; b=b||"";
  var m=a.length,n=b.length;
  if(m===0) return n; if(n===0) return m;
  var dp=[];
  for(var i=0;i<=m;i++) dp.push([i].concat(new Array(n).fill(0)));
  for(var j=0;j<=n;j++) dp[0][j]=j;
  for(i=1;i<=m;i++){
    for(j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}

var GRADE_LETTERS = ["A","B","C","D","E"];

function hexToRgba(hex,alpha){

  return "rgba("+r+","+g+","+b+","+alpha+")";
}

function playerEvaluations(playerId){

}
function playerMatchRows(playerId){
  return DB.matchPlayers.filter(function(mp){return mp.playerId===playerId;}).map(function(mp){
    return {mp:mp, match:matchById(mp.matchId)};
  }).filter(function(r){return !!r.match;}).sort(function(a,b){return (b.match.date||"").localeCompare(a.match.date||"");});
}
function playerLastObserved(playerId){
  var rows = playerMatchRows(playerId);
  return rows.length ? rows[0].match.date : null;
}
function playerObservationCount(playerId){
  return DB.matchPlayers.filter(function(mp){return mp.playerId===playerId;}).length + DB.evaluations.filter(function(e){return e.playerId===playerId && e.evaluationType==="Manual";}).length;
}
function matchLineup(matchId,clubId){
  return DB.matchPlayers.filter(function(mp){return mp.matchId===matchId && mp.clubId===clubId;}).sort(function(a,b){
    var av=(a.shirtNumber===""||a.shirtNumber===null||a.shirtNumber===undefined)?999:parseInt(a.shirtNumber,10);
    var bv=(b.shirtNumber===""||b.shirtNumber===null||b.shirtNumber===undefined)?999:parseInt(b.shirtNumber,10);
    return av-bv;
  });
}
function matchPlayersOfInterest(matchId){
  var list = DB.matchPlayers.filter(function(mp){return mp.matchId===matchId && mp.playerOfInterest;});
  // Manual preference order within this match — lower interestRank first ("liked most" at the
  // top). Entries without a rank yet (legacy data) fall back to when they were flagged.
  list.sort(function(a,b){
    var ar = a.interestRank||0, br = b.interestRank||0;
    if(ar!==br) return ar-br;
    return (a.interestDate||"").localeCompare(b.interestDate||"");
  });
  return list;
}
function matchEvaluations(matchId){
  return DB.evaluations.filter(function(e){return e.matchId===matchId;});
}
function updatePlayerCurrentRatings(playerId){
  var p=playerById(playerId);
  if(!p) return;
  var evs=playerEvaluations(playerId);
  if(evs.length){
    if(evs[0].performance!==null && evs[0].performance!==undefined && evs[0].performance!=="") p.currentPerformance=evs[0].performance;
    if(evs[0].potential!==null && evs[0].potential!==undefined && evs[0].potential!=="") p.currentPotential=evs[0].potential;
  }
  p.updatedAt=nowISO();
}
// Height and Position track the most recently *dated* observation, not just the most recently
// entered one — so going back to fill in an older match afterwards never overwrites what a newer
// match already established (a young player's height/best position can shift month to month).
// `dateField` remembers the source date of whatever's currently stored, so later comparisons are
// always against the true latest, regardless of the order things were entered in.
function applyLatestPlayerField(p,field,dateField,value,sourceDate){
  if(value===undefined || value===null || String(value).trim()==="") return;
  if(!sourceDate) return;
  if(sourceDate >= (p[dateField]||"")){
    p[field] = value;
    p[dateField] = sourceDate;
  }
}
function maybeSeedGeneralCharacteristics(playerId,text){
  if(!text || !text.trim()) return;
  var p = playerById(playerId);
  if(!p) return;
  if(!p.characteristics || !p.characteristics.trim()){
    p.characteristics = text;
    p.updatedAt = nowISO();
  }
}
// The player's earliest-dated "Match" evaluation (ties broken by creation order) — this is what
// "the first match they were evaluated in" means, not whichever match happened to be entered
// first chronologically by the scout.
function firstMatchEvaluation(playerId){
  var matchEvals = DB.evaluations.filter(function(e){return e.playerId===playerId && e.evaluationType==="Match" && e.matchId;});
  if(!matchEvals.length) return null;
  matchEvals.sort(function(a,b){
    var d = (a.date||"").localeCompare(b.date||"");
    if(d) return d;
    return (a.createdAt||"").localeCompare(b.createdAt||"");
  });
  return matchEvals[0];
}
function upsertMatchEvaluation(playerId,matchId,patch){
  if(!playerId || !matchId) return null;
  var ev = DB.evaluations.find(function(e){return e.playerId===playerId && e.matchId===matchId && e.evaluationType==="Match";});
  if(ev){
    Object.keys(patch).forEach(function(k){ ev[k]=patch[k]; });
    ev.updatedAt = nowISO();
  } else {
    var m = matchById(matchId);
    ev = Object.assign({
      id:uid("eval"), playerId:playerId, matchId:matchId, evaluationType:"Match",
      date:(m?m.date:todayISO()), performance:"", potential:"", characteristics:"", observations:"", recommendation:"",
      scoutId:DB.currentScoutId, createdAt:nowISO()
    },patch);
    DB.evaluations.push(ev);
  }
  if(patch.characteristics!==undefined){
    var first = firstMatchEvaluation(playerId);
    if(first && first.id===ev.id){
      // Editing the characteristics of the player's FIRST evaluated match keeps the profile's
      // General Characteristics in sync with it — not just seeded once, but kept matching on
      // every later edit to that same first-match entry.
      var p = playerById(playerId);
      if(p){ p.characteristics = ev.characteristics||""; p.updatedAt = nowISO(); }
    } else {
      maybeSeedGeneralCharacteristics(playerId,patch.characteristics);
    }
  }
  updatePlayerCurrentRatings(playerId);
  return ev;
}

/* ============================================================
   DUPLICATE DETECTION
   ============================================================ */
function findPlayerCandidates(name,clubId,nationality,birthYear){
  var nn = normName(name);
  if(!nn) return [];
  var scored = [];
  DB.players.forEach(function(p){
    var pnn = normName(p.name);
    var score = 0;
    if(pnn===nn) score+=70;
    else {
      var dist = levenshtein(pnn,nn);
      var maxLen = Math.max(pnn.length,nn.length);
      var sim = 1-(dist/Math.max(maxLen,1));
      if(sim>=0.72) score += Math.round(sim*45);
    }
    if(score===0) return;
    if(clubId && p.clubId===clubId) score+=18;
    if(nationality && p.nationality && normName(p.nationality)===normName(nationality)) score+=8;
    var py = p.dob ? p.dob.slice(0,4) : p.birthYear;
    if(birthYear && py && String(py)===String(birthYear)) score+=12;
    if(score>=45) scored.push({player:p,score:score});
  });
  scored.sort(function(a,b){return b.score-a.score;});
  return scored.slice(0,4);
}

/* ============================================================
   PERSISTENCE — real backend (GET/PUT /api/db), backed by Postgres.
   Every device reads/writes the same server-side row, so any change made on
   one device shows up on the others — see checkForRemoteUpdates() below.
   ============================================================ */
function serialize(){
  return JSON.stringify(DB);
}
function saveLocalFallback(){
  try{ localStorage.setItem("touchline-db-cache", serialize()); }catch(e){}
}
var pendingSave = false;
var saveQueued = false;
var saveRetryTimer = null;
var saveRetryDelayMs = 3000;
// Optimistic local update + save-and-retry-forever against the server. The screen updates
// immediately from the in-memory DB (no need to wait on the network for your own edit to show up);
// the network write happens in the background and quietly retries with backoff if it fails, so a
// flaky connection never silently drops data — it just keeps trying until it lands.
async function persist(opts){
  opts = opts || {};
  saveLocalFallback();
  if(opts.toast) showToastImmediate(opts.toast);
  if(opts.redirectHash && opts.redirectHash !== location.hash){ location.hash = opts.redirectHash; }
  else { render(); }
  queueServerSave();
}
function queueServerSave(){
  saveQueued = true;
  if(pendingSave) return;
  runServerSave();
}
async function runServerSave(){
  saveQueued = false;
  pendingSave = true;
  if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
  try{
    var res = await fetch("/api/db",{
      method:"PUT", credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body: serialize()
    });
    if(res.status===401){ location.href="/login"; return; }
    if(!res.ok) throw new Error("PUT /api/db failed: "+res.status);
    var body = await res.json();
    LAST_SYNCED_UPDATED_AT = body.updatedAt || null;
    saveRetryDelayMs = 3000;
    if(SERVER_SYNC!=="ok"){ SERVER_SYNC="ok"; render(); }
  }catch(err){
    console.warn("MF Base: save failed, retrying shortly.",err);
    if(SERVER_SYNC!=="offline"){ SERVER_SYNC="offline"; showToastImmediate("Sem ligação — a tentar guardar outra vez…"); render(); }
    saveRetryTimer = setTimeout(runServerSave, saveRetryDelayMs);
    saveRetryDelayMs = Math.min(saveRetryDelayMs*2, 30000);
    return; // keep pendingSave true while a retry is scheduled — never fire overlapping saves
  }
  pendingSave = false;
  if(saveQueued) runServerSave();
}
// Background sync: while the app stays open, periodically (and on tab focus) check whether
// another device saved something new, and pull it in — this is what makes "always up to date
// regardless of which device I use" actually true, not just true at page-load time. Skipped
// while a local save is in flight, a field is actively focused, or a modal is open, so it never
// yanks the screen out from under something the person is doing right now.
var BG_SYNC_INTERVAL_MS = 25000;
function isUserActivelyEditing(){
  var el = document.activeElement;
  if(!el) return false;
  var tag = el.tagName;
  return tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT" || el.isContentEditable;
}
function isModalOpen(){
  var root = document.getElementById("modalRoot");
  return !!(root && root.innerHTML.trim());
}
async function checkForRemoteUpdates(){
  if(pendingSave || saveQueued) return;
  if(isUserActivelyEditing() || isModalOpen()) return;
  try{
    var res = await fetch("/api/db",{cache:"no-store",credentials:"same-origin"});
    if(res.status===401){ location.href="/login"; return; }
    if(!res.ok) return;
    var body = await res.json();
    if(body && body.data && body.updatedAt && body.updatedAt !== LAST_SYNCED_UPDATED_AT){
      DB = body.data;
      LAST_SYNCED_UPDATED_AT = body.updatedAt;
      if(SERVER_SYNC!=="ok") SERVER_SYNC="ok";
      try{ localStorage.setItem("touchline-db-cache", JSON.stringify(DB)); }catch(e){}
      render();
    }
  }catch(e){ /* offline or blip — the next periodic/focus check will retry */ }
}
function startBackgroundSync(){
  setInterval(checkForRemoteUpdates, BG_SYNC_INTERVAL_MS);
  window.addEventListener("focus", checkForRemoteUpdates);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkForRemoteUpdates(); });
}

function showToastImmediate(msg){
  var wrap = document.getElementById("toastWrap");
  if(!wrap) return;
  var el = document.createElement("div");
  el.className="toast";
  el.textContent=msg;
  wrap.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add("show"); });
  setTimeout(function(){ el.classList.remove("show"); setTimeout(function(){ el.remove(); },250); },2600);
}

/* ============================================================

   ============================================================ */
function parseHash(){
  var h = location.hash.replace(/^#\/?/,"");
  var parts = h.split("/").filter(Boolean);
  if(parts.length===0) return {name:"dashboard",params:{}};
  if(parts[0]==="matches"){
    if(parts[1]==="new") return {name:"match-new",params:{}};
    if(parts[1] && parts[2]==="edit") return {name:"match-edit",params:{id:decodeURIComponent(parts[1])}};
    if(parts[1]) return {name:"match-detail",params:{id:decodeURIComponent(parts[1])}};
    return {name:"matches",params:{}};
  }
  if(parts[0]==="players"){
    if(parts[1]==="new") return {name:"player-new",params:{}};
    if(parts[1] && parts[2]==="edit") return {name:"player-edit",params:{id:decodeURIComponent(parts[1])}};
    if(parts[1]) return {name:"player-detail",params:{id:decodeURIComponent(parts[1])}};
    return {name:"players",params:{}};
  }
  if(parts[0]==="calendar") return {name:"calendar",params:{}};
  if(parts[0]==="agenda") return {name:"agenda",params:{}};
  if(parts[0]==="teams-watch") return {name:"teams-watch",params:{}};
  return {name:"dashboard",params:{}};
}
function navigate(hash){ location.hash = hash; }
window.addEventListener("hashchange",function(){ ROUTE = parseHash(); render(); window.scrollTo(0,0); });

      case "players": pageHtml = pagePlayers(); break;

}

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
function wireGlobalSearch(){
  var input = document.getElementById("globalSearchInput");
  var results = document.getElementById("globalSearchResults");
  if(!input) return;
  var onSearch = debounce(function(){
    var q = normName(input.value);
    if(!q){ results.classList.add("empty"); results.innerHTML=""; return; }
    var playerMatches = visiblePlayers().filter(function(p){
      return normName(p.name).indexOf(q)>=0 || normName(clubName(p.clubId)).indexOf(q)>=0 ||
        normName(p.nationality||"").indexOf(q)>=0 || normName(p.firstPosition||"").indexOf(q)>=0 || normName(p.secondPosition||"").indexOf(q)>=0 ||
        normName(posLabel(p.firstPosition)).indexOf(q)>=0 || normName(posLabel(p.secondPosition)).indexOf(q)>=0;
    }).slice(0,6);
    var matchMatches = DB.matches.filter(function(m){
      return normName(clubName(m.homeClubId)).indexOf(q)>=0 || normName(clubName(m.awayClubId)).indexOf(q)>=0 || normName(m.competition||"").indexOf(q)>=0;
    }).slice(0,5);
    var clubMatches = DB.clubs.filter(function(c){ return normName(c.name).indexOf(q)>=0; }).slice(0,4);
    var html="";
    if(playerMatches.length){
      html += '<div class="sr-group-label">Players</div>';
      playerMatches.forEach(function(p){
        html += '<div class="sr-item" data-nav="#/players/'+encodeURIComponent(p.id)+'">'+avatarHtml(p,28)+'<div><div>'+esc(p.name)+'</div><div class="sr-item-sub">'+esc(posLabel(p.firstPosition)||"")+(p.clubId?" · "+esc(clubName(p.clubId)):"")+'</div></div></div>';
      });
    }
    if(matchMatches.length){
      html += '<div class="sr-group-label">Matches</div>';
      matchMatches.forEach(function(m){
        html += '<div class="sr-item" data-nav="#/matches/'+encodeURIComponent(m.id)+'">'+crestHtml(clubById(m.homeClubId),24)+'<div><div>'+esc(clubName(m.homeClubId))+' vs '+esc(clubName(m.awayClubId))+'</div><div class="sr-item-sub">'+esc(m.competition||"")+' · '+fmtDate(m.date)+'</div></div></div>';
      });
    }
    if(clubMatches.length){
      html += '<div class="sr-group-label">Clubs</div>';
      clubMatches.forEach(function(c){
        var playersAtClub = visiblePlayers().filter(function(p){return p.clubId===c.id;}).length;
        html += '<div class="sr-item" data-nav="#/players?club='+encodeURIComponent(c.id)+'">'+crestHtml(c,24)+'<div><div>'+esc(c.name)+'</div><div class="sr-item-sub">'+playersAtClub+' player'+(playersAtClub===1?'':'s')+' in database</div></div></div>';
      });
    }
    if(!html){ html = '<div class="sr-item" style="cursor:default;color:var(--text-faint)">No results</div>'; }
    results.innerHTML = html;
    results.classList.remove("empty");
  },140);
  input.addEventListener("input",onSearch);
  input.addEventListener("focus",onSearch);
  results.addEventListener("click",function(e){
    var item = e.target.closest("[data-nav]");
    if(!item) return;
    var href = item.getAttribute("data-nav");
    if(href.indexOf("?club=")>=0){
      var clubId = href.split("?club=")[1];
      PLAYER_FILTERS.club = decodeURIComponent(clubId);
      navigate("#/players");
    } else {
      navigate(href);
    }
    input.value=""; results.classList.add("empty"); results.innerHTML="";
    closeModal();
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest("#globalSearchWrap")){ results.classList.add("empty"); }
  },{once:true});
}
function openSearchModal(){
  var html = '<div class="modal-pad">'+
    '<div class="modal-head"><div class="modal-title">Search</div><button class="icon-btn" data-close-modal>'+ic("close")+'</button></div>'+
    '<div class="search-wrap" id="globalSearchWrap" style="max-width:none;margin-top:10px">'+
      '<span class="search-icon">'+ic("search")+'</span>'+
      '<input class="search-input" id="globalSearchInput" placeholder="Search players, clubs, positions…" autocomplete="off">'+
    '</div>'+
    '<div class="search-results empty" id="globalSearchResults"></div>'+
  '</div>';
  openModal(html);
  wireGlobalSearch();
  var input = document.getElementById("globalSearchInput");
  if(input) input.focus();
}

/* ============================================================
   MODAL INFRA
   ============================================================ */
function openModal(html){
  var root = document.getElementById("modalRoot");
  if(!root) return;
  root.innerHTML = '<div class="overlay" id="activeOverlay"><div class="modal">'+html+'</div></div>';
  var overlay = document.getElementById("activeOverlay");
  overlay.addEventListener("mousedown",function(e){ if(e.target===overlay) closeModal(); });
  document.addEventListener("keydown",escCloseOnce);
}
function escCloseOnce(e){ if(e.key==="Escape"){ closeModal(); } }
function closeModal(){
  var root = document.getElementById("modalRoot");
  if(root) root.innerHTML="";
  document.removeEventListener("keydown",escCloseOnce);
}
function confirmModal(message,confirmLabel,onConfirm){
  var html = '<div class="modal-pad"><div class="modal-head"><div class="modal-title">Are you sure?</div><button class="icon-btn" data-close-modal>'+ic("close")+'</button></div>'+
    '<p style="color:var(--text-muted);font-size:13px;line-height:1.5;margin:8px 0 18px">'+esc(message)+'</p>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-block" data-close-modal>Cancel</button><button class="btn btn-danger btn-block" id="confirmModalYes">'+esc(confirmLabel||"Confirm")+'</button></div>'+
  '</div>';
  openModal(html);
  var btn = document.getElementById("confirmModalYes");
  if(btn) btn.addEventListener("click",function(){ closeModal(); onConfirm(); });
}

// Manual backup: shows the full database as JSON so it can be copied out and kept somewhere safe,
// independent of the app itself (the artifact viewer sandbox does not allow triggering a real file
// download, so a copyable text box is the reliable option here).
ACTIONS["open-backup"] = function(){
  var json = JSON.stringify(DB,null,2);
  var html = '<div class="modal-pad"><div class="modal-head"><div class="modal-title">Backup Data</div><button class="icon-btn" data-close-modal>'+ic("close")+'</button></div>'+
    '<div class="field-hint" style="margin-bottom:10px">This is all of your data (matches, players, evaluations, notes) as plain text. Copy it and paste it somewhere safe — Notes, a text file, an email to yourself — as an independent backup.</div>'+
    '<textarea id="backupJsonText" class="textarea backup-textarea" readonly>'+esc(json)+'</textarea>'+
    '<button type="button" class="btn btn-primary btn-block" style="margin-top:10px" data-action="copy-backup-json">'+ic("check")+' Copy to Clipboard</button>'+
  '</div>';
  openModal(html);
  onAfterRender(function(){
    var ta = document.getElementById("backupJsonText");
    if(ta) ta.focus();
  });
};
ACTIONS["copy-backup-json"] = function(){
  var ta = document.getElementById("backupJsonText");
  if(!ta) return;
  ta.focus(); ta.select();
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ showToastImmediate("Copied — paste it somewhere safe"); }).catch(function(){ showToastImmediate("Couldn't auto-copy — text is selected, use Cmd/Ctrl+C"); });
    } else {
      document.execCommand("copy");
      showToastImmediate("Copied — paste it somewhere safe");
    }
  }catch(e){ showToastImmediate("Couldn't auto-copy — text is selected, use Cmd/Ctrl+C"); }
};
function bindGlobalEvents(){
  document.addEventListener("click",function(e){
    // pill group single-select
    var pill = e.target.closest(".pill-opt");
    if(pill){
      var group = pill.closest(".pillgroup");
      if(group){
        var hidden = group.querySelector("input[type=hidden]");
        if(hidden){ hidden.value = pill.dataset.value; hidden.dispatchEvent(new Event("change",{bubbles:true})); }
        Array.prototype.forEach.call(group.querySelectorAll(".pill-opt"),function(b){ b.classList.toggle("on", b===pill); });
      }
      return;
    }
    // inline edit trigger
    var ie = e.target.closest(".inline-edit");
    if(ie && !ie.classList.contains("editing")){
      startInlineEdit(ie);
      return;
    }
    // data-action buttons
    var actionEl = e.target.closest("[data-action]");
    if(actionEl){
      var action = actionEl.dataset.action;
      if(ACTIONS[action]){ e.preventDefault(); ACTIONS[action](actionEl,e); }
      return;
    }
    // close modal buttons
    if(e.target.closest("[data-close-modal]")){ closeModal(); return; }
    // click outside an open multi-select filter panel closes it
    if(MSF_OPEN_PANEL && !e.target.closest(".msf")){ MSF_OPEN_PANEL=null; render(); }
  });
  document.addEventListener("change",function(e){
    var cb = e.target.closest("[data-msf-checkbox]");
    if(cb){
      var scopeFn = MSF_SCOPES[cb.dataset.scope];
      if(scopeFn){
        var f = scopeFn();
        var key = cb.dataset.key;
        var arr = f[key] || (f[key]=[]);
        var val = cb.value;
        var idx = arr.indexOf(val);
        if(cb.checked){ if(idx<0) arr.push(val); } else if(idx>=0){ arr.splice(idx,1); }
        render();
      }
    }
    var msSel = e.target.closest('[data-action-select="set-match-status"]');
    if(msSel){
      var mForStatus = matchById(msSel.dataset.id);
      if(mForStatus){ mForStatus.status = msSel.value; persist({}); }
    }
    var mmSel = e.target.closest('[data-action-select="set-match-mode"]');
    if(mmSel){
      var mForMode = matchById(mmSel.dataset.id);
      if(mForMode){
        var wasVideo = mForMode.observationMode==="VIDEO";
        mForMode.observationMode = mmSel.value;
        if(mmSel.value!=="VIDEO") mForMode.watchDate = "";
        persist({});
        if(mmSel.value==="VIDEO" && !wasVideo) openWatchDateModal(mForMode.id);
      }
    }
  });
  document.addEventListener("submit",function(e){
    var form = e.target.closest("form[data-form]");
    if(!form) return;
    e.preventDefault();
    var handler = FORM_HANDLERS[form.dataset.form];
    if(handler) handler(form,e);
  });
  // autosave on blur for textareas / text inputs marked data-autosave
  document.addEventListener("blur",function(e){
    var el = e.target;
    if(!el || !el.matches) return;
    if(el.matches("[data-autosave]") && !el.dataset.dirty0){ }
    if(el.matches("[data-autosave]")){
      var key = el.dataset.autosave;
      var initial = el.dataset.initial !== undefined ? el.dataset.initial : "";
      if(el.value !== initial){
        el.dataset.initial = el.value;
        AUTOSAVE_HANDLERS[key] && AUTOSAVE_HANDLERS[key](el);
      }
    }
  },true);
}
var FORM_HANDLERS = {};
var AUTOSAVE_HANDLERS = {};

function startInlineEdit(el){
  var field = el.dataset.field;
  var current = el.dataset.raw !== undefined ? el.dataset.raw : el.textContent.trim();
  // Nationality fields get the same searchable country picker used on the Add/Edit Player and
  // pitch-slot forms, right on the profile — so a scout can double-check the spelling matches the
  // rest of the app instead of retyping into a plain text box.
  if(field==="nationality" || field==="nationality2"){ startInlineCountryEdit(el,current); return; }
  var input = document.createElement("input");
  input.className = "input";
  input.style.minHeight="30px"; input.style.padding="4px 7px"; input.style.fontSize="inherit"; input.style.fontWeight="inherit"; input.style.width = Math.max(60, el.offsetWidth+30)+"px";
  input.value = current==="—"?"":current;
  input.dataset.field = field;
  var editKey = el.dataset.editKey;
  el.classList.add("editing");
  el.style.display="none";
  el.parentNode.insertBefore(input, el);
  input.focus(); input.select();
  function commit(){
    var val = input.value;
    input.remove();
    el.style.display="";
    el.classList.remove("editing");
    if(val !== current){
      INLINE_EDIT_HANDLERS[editKey] && INLINE_EDIT_HANDLERS[editKey](el,val);
    }
  }
  input.addEventListener("blur",commit);
  input.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ e.preventDefault(); input.blur(); }
    if(e.key==="Escape"){ input.removeEventListener("blur",commit); input.remove(); el.style.display=""; el.classList.remove("editing"); }
  });
}
function startInlineCountryEdit(el,current){
  var editKey = el.dataset.editKey;
  var field = el.dataset.field;
  var comboId = "inlineNatCombo_"+field+"_"+el.dataset.id;
  el.classList.add("editing");
  el.style.display="none";
  var wrap = document.createElement("div");
  wrap.style.display="inline-block";
  wrap.style.minWidth = Math.max(150, el.offsetWidth+40)+"px";
  wrap.style.verticalAlign="middle";
  wrap.innerHTML = renderCountryCombo(comboId,"",current==="—"?"":current,"Search country…");
  el.parentNode.insertBefore(wrap, el);
  var input = document.getElementById(comboId+"_text");
  input.style.minHeight="30px"; input.style.padding="4px 7px"; input.style.fontSize="inherit"; input.style.fontWeight="inherit";
  wireCountryCombo(comboId);
  input.focus(); input.select();
  function commit(){
    var val = input.value;
    wrap.remove();
    el.style.display="";
    el.classList.remove("editing");
    if(val !== (current==="—"?"":current)){
      INLINE_EDIT_HANDLERS[editKey] && INLINE_EDIT_HANDLERS[editKey](el,val);
    }
  }
  input.addEventListener("blur",commit);
  input.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ e.preventDefault(); input.blur(); }
    if(e.key==="Escape"){ input.removeEventListener("blur",commit); wrap.remove(); el.style.display=""; el.classList.remove("editing"); }
  });
}
var INLINE_EDIT_HANDLERS = {};

/* ============================================================
   CLUB COMBOBOX (search / select / quick-create)
   ============================================================ */
// A searchable country picker (used for Nationality fields) — same combo look as the club/player
// pickers, but backed by the fixed COUNTRY_LIST so everyone's entries land on the same spelling
// (no more "Saudi Arabia" vs "Arábia Saudita" splitting what should be one nationality). Typing
// without picking a suggestion still submits whatever was typed, in case a country is missing.
function renderCountryCombo(id,name,selectedName,placeholder){
  return '<div class="combo" data-combo-root="'+id+'">'+
    '<input class="input" name="'+name+'" id="'+id+'_text" autocomplete="off" placeholder="'+esc(placeholder||"Search country…")+'" value="'+escAttr(selectedName||"")+'">'+
    '<div class="combo-list" id="'+id+'_list" hidden></div>'+
  '</div>';
}
function wireCountryCombo(id){
  var text = document.getElementById(id+"_text");
  var list = document.getElementById(id+"_list");
  if(!text||!list) return;
  function renderList(q){
    var nn = normName(q);
    var matches = !nn ? COUNTRY_LIST.slice(0,8) : COUNTRY_LIST.filter(function(c){return normName(c).indexOf(nn)>=0;}).slice(0,8);
    var html = matches.map(function(c){
      var flag = flagForNationality(c);
      return '<div class="combo-item" data-country="'+escAttr(c)+'">'+(flag?'<span class="flag-emoji" style="font-size:18px">'+flag+'</span>':'')+'<div>'+esc(c)+'</div></div>';
    }).join("");
    if(!html) html = '<div class="combo-item" style="color:var(--text-faint);cursor:default">No match — your typed text will still be saved</div>';
    list.innerHTML = html;
    list.hidden = false;
  }
  text.addEventListener("focus",function(){ renderList(text.value); });
  text.addEventListener("input",function(){ renderList(text.value); });
  list.addEventListener("mousedown",function(e){
    e.preventDefault();
    var item = e.target.closest("[data-country]");
    if(item){ text.value = item.dataset.country; list.hidden = true; }
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest('[data-combo-root="'+id+'"]')) list.hidden = true;
  });
}
function renderClubCombo(id,name,selectedId,placeholder){
  var selected = selectedId ? clubById(selectedId) : null;
  return '<div class="combo" data-combo-root="'+id+'">'+
    '<input type="hidden" name="'+name+'" id="'+id+'_hidden" value="'+(selectedId||"")+'">'+
    '<div class="combo-input-wrap" style="position:relative">'+
      '<div class="combo-crest-preview" id="'+id+'_crest" style="position:absolute;left:9px;top:50%;transform:translateY(-50%);display:'+(selected?"flex":"none")+';align-items:center;pointer-events:none">'+(selected?crestHtml(selected,20):"")+'</div>'+
      '<input class="input" id="'+id+'_text" autocomplete="off" placeholder="'+esc(placeholder||"Search or create club…")+'" value="'+(selected?escAttr(selected.name):"")+'" style="'+(selected?"padding-left:37px":"")+'">'+
    '</div>'+
    '<div class="combo-list" id="'+id+'_list" hidden></div>'+
  '</div>';
}
function wireClubCombo(id){
  var text = document.getElementById(id+"_text");
  var hidden = document.getElementById(id+"_hidden");
  var list = document.getElementById(id+"_list");
  var crestPreview = document.getElementById(id+"_crest");
  if(!text||!list) return;
  function syncCrest(){
    if(!crestPreview) return;
    var c = hidden.value ? clubById(hidden.value) : null;
    if(c){ crestPreview.style.display="flex"; crestPreview.innerHTML=crestHtml(c,20); text.style.paddingLeft="37px"; }
    else { crestPreview.style.display="none"; crestPreview.innerHTML=""; text.style.paddingLeft=""; }
  }
  function renderList(q){
    var nn = normName(q);
    var matches = !nn ? DB.clubs.slice(0,8) : DB.clubs.filter(function(c){return normName(c.name).indexOf(nn)>=0;}).slice(0,8);
    var html = matches.map(function(c){
      return '<div class="combo-item" data-club-id="'+c.id+'">'+crestHtml(c,24)+'<div><div>'+esc(c.name)+'</div>'+(c.country?'<div class="combo-item-sub">'+esc(c.country)+'</div>':'')+'</div></div>';
    }).join("");
    if(q && q.trim() && !matches.some(function(c){return normName(c.name)===nn;})){
      html += '<div class="combo-create" data-create-club="'+escAttr(q.trim())+'">'+ic("plus")+' Create club "'+esc(q.trim())+'"</div>';
    }
    if(!html) html = '<div class="combo-item" style="color:var(--text-faint);cursor:default">Type to search or create…</div>';
    list.innerHTML = html;
    list.hidden = false;
  }
  text.addEventListener("focus",function(){ renderList(text.value); });
  text.addEventListener("input",function(){ hidden.value=""; syncCrest(); renderList(text.value); });
  list.addEventListener("mousedown",function(e){
    e.preventDefault();
    var item = e.target.closest("[data-club-id]");
    if(item){
      var c = clubById(item.dataset.clubId);
      hidden.value = c.id; text.value = c.name; list.hidden = true;
      syncCrest();
      return;
    }
    var create = e.target.closest("[data-create-club]");
    if(create){
      openClubCreateModal(create.dataset.createClub,function(newClub){
        hidden.value = newClub.id; text.value = newClub.name; list.hidden = true;
        syncCrest();
      });
    }
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest('[data-combo-root="'+id+'"]')) list.hidden = true;
  });
}
function openClubCreateModal(name,onCreate){
  var html = '<div class="modal-pad"><div class="modal-head"><div class="modal-title">New Club</div><button class="icon-btn" data-close-modal>'+ic("close")+'</button></div>'+
    '<form data-form="__inline_club_create" class="stack" style="margin-top:10px">'+
    '<div class="field"><label class="field-label">Club Name</label><input class="input" name="name" value="'+escAttr(name||"")+'" required></div>'+
    '<div class="field"><label class="field-label">Country <span class="opt">optional</span></label><input class="input" name="country" placeholder="e.g. Saudi Arabia" list="countryList"></div>'+
    '<div class="field"><label class="field-label">Logo URL <span class="opt">optional</span></label><input class="input" name="logo" placeholder="https://…"></div>'+
    '<button class="btn btn-primary btn-block" type="submit">Create Club</button>'+
    '</form></div>';
  openModal(html);
  FORM_HANDLERS["__inline_club_create"] = function(form){
    var fd = new FormData(form);
    var club = {id:uid("club"),name:(fd.get("name")||"").trim(),country:(fd.get("country")||"").trim(),logo:(fd.get("logo")||"").trim(),createdAt:nowISO()};
    if(!club.name) return;
    DB.clubs.push(club);
    closeModal();
    onCreate(club);
  };
}

  var text = document.getElementById(id+"_text");
