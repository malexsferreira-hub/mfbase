function openDuplicateModal(candidates,onResolve){
  var html = '<div class="modal-pad"><div class="modal-head"><div class="modal-title">Possible Existing Player</div><button class="icon-btn" data-close-modal>'+ic("close")+'</button></div>'+
    '<p style="color:var(--text-muted);font-size:12.5px;margin:6px 0 2px;line-height:1.5">This name looks similar to a player already in your database. Avoid creating a duplicate profile:</p>';
  candidates.forEach(function(c){
    var p = c.player;
    html += '<div class="candidate-card" data-use-existing="'+p.id+'">'+avatarHtml(p,42)+
      '<div><div style="font-weight:700;font-size:13.5px">'+esc(p.name)+'</div><div style="font-size:11.5px;color:var(--text-muted)">'+esc(clubName(p.clubId)||"No club")+(p.nationality?" · "+esc(p.nationality):"")+(dobDisplay(p)!=="—"?" · "+esc(dobDisplay(p)):"")+'</div></div></div>';
  });
  html += '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-block" data-close-modal>Cancel</button><button class="btn btn-primary btn-block" data-create-new-anyway="1">Create New Player</button></div></div>';
  openModal(html);
  var overlay = document.getElementById("activeOverlay");
  overlay.addEventListener("click",function(e){
    var useEl = e.target.closest("[data-use-existing]");
    if(useEl){ closeModal(); onResolve({type:"existing",playerId:useEl.dataset.useExisting}); return; }
    if(e.target.closest("[data-create-new-anyway]")){ closeModal(); onResolve({type:"new"}); return; }
  });
}
function countryDatalist(){
  return '<datalist id="countryList">'+COUNTRY_LIST.map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist>';
}
function positionOptions(sel){
  return '<option value="">—</option>'+POSITIONS.map(function(p){return '<option value="'+p+'"'+(p===sel?" selected":"")+'>'+p+' · '+POSITION_LABELS[p]+'</option>';}).join("");
}

/* ============================================================
   PAGE: DASHBOARD
   ============================================================ */
function pageDashboard(){
  var totalPlayers = visiblePlayers().length;
  var totalMatches = DB.matches.length;
  var matchesToWatch = DB.matches.filter(function(m){return m.status==="To Watch"||m.status==="Scheduled";}).length;
  var matchesWatched = DB.matches.filter(function(m){return m.status==="Watched"||m.status==="Partially Watched";}).length;
  var playersObserved = new Set(DB.matchPlayers.map(function(mp){return mp.playerId;})).size;
  var playersOfInterestCount = new Set(DB.matchPlayers.filter(function(mp){return mp.playerOfInterest;}).map(function(mp){return mp.playerId;})).size;
  var totalEvaluations = DB.evaluations.length;

  var upcoming = DB.matches.filter(function(m){return m.status==="To Watch"||m.status==="Scheduled";}).sort(function(a,b){return (a.date||"").localeCompare(b.date||"");}).slice(0,5);
  var recentMatches = DB.matches.filter(function(m){return m.status==="Watched"||m.status==="Partially Watched";}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"");}).slice(0,5);
  // No "Recent Evaluations" panel anymore — that space now lets Players of Interest show more
  // rows, sorted with the most recently-evaluated player first.
  var interestPlayers = DB.players.filter(function(p){return DB.matchPlayers.some(function(mp){return mp.playerId===p.id && mp.playerOfInterest;});});
  interestPlayers.sort(function(a,b){
    var evA = playerEvaluations(a.id), evB = playerEvaluations(b.id);
    var dA = evA.length ? (evA[0].date||"") : "";
    var dB = evB.length ? (evB[0].date||"") : "";
    return dB.localeCompare(dA);
  });
  interestPlayers = interestPlayers.slice(0,12);

  var html = '<div class="stack">';
  html += '<div class="section-head"><div><div class="eyebrow">Overview</div><h1 style="font-size:24px">Dashboard</h1></div>'+
    '<div class="dash-header-actions"><a class="btn" href="#/matches/new">'+ic("addmatch")+' Add Match</a><a class="btn btn-primary" href="#/players/new">'+ic("addplayer")+' Add Player</a></div></div>';

  html += '<div class="stat-grid">'+
    statTile(totalPlayers,"Total Players")+
    statTile(totalMatches,"Total Matches")+
    statTile(matchesToWatch,"Matches To Watch")+
    statTile(matchesWatched,"Matches Watched")+
    statTile(playersObserved,"Players Observed")+
    statTile(playersOfInterestCount,"Players of Interest")+
    statTile(totalEvaluations,"Total Evaluations")+
  '</div>';

  // Four independent groups (not two), so a mobile-only CSS `order` override can slot Notes in
  // right after the Agenda while desktop keeps its usual two-column layout — see .dash-grid and
  // the .dash-col-* rules (desktop: column-major fill agenda→matches, notes→poi; mobile: single
  // column reordered to agenda, notes, matches, poi).
  html += '<div class="grid dash-grid">';
  html += '<div class="dash-col-agenda">'+dashDayAgendaPanel()+'</div>';
  html += '<div class="stack dash-col-matches">'+
    dashPanel("TO WATCH", upcoming.length ? upcoming.map(dashMatchRow).join("") : emptyRow("No matches scheduled yet.","Add Match","#/matches/new"))+
    dashPanel("Recently Observed Matches", recentMatches.length ? recentMatches.map(dashMatchRow).join("") : emptyRow("No matches watched yet."))+
  '</div>';
  html += '<div class="dash-col-notes">'+dashNotesPanel()+'</div>';
  html += '<div class="dash-col-poi">'+dashPanel("Players of Interest", interestPlayers.length ? interestPlayers.map(dashPlayerRow).join("") : emptyRow("Star players in a match lineup to track them here."))+'</div>';
  html += '</div>';
  return html;
}
function statTile(value,label){
  return '<div class="stat-tile"><div class="stat-value mono">'+value+'</div><div class="stat-label">'+label+'</div></div>';
}
function dashPanel(title,rowsHtml){
  return '<div class="card card-pad"><div class="section-head"><div class="section-title">'+title+'</div></div><div class="stack" style="gap:2px">'+rowsHtml+'</div></div>';
}
function emptyRow(msg,btnLabel,btnHref){
  return '<div style="padding:14px 2px;color:var(--text-faint);font-size:12.5px">'+esc(msg)+(btnLabel?' <a href="'+btnHref+'" style="color:var(--accent);font-weight:700">'+btnLabel+' →</a>':'')+'</div>';
}
// Most competitions already carry the age group in their own name (e.g. "Saudi U-15 Premier
// League", from the SAFF calendar sync) — so a match without its own Age Group field filled in
// still gets a sensible mobile badge instead of forcing that field to be set on every match.
function deriveAgeGroupFromCompetition(competition){
  if(!competition) return "";
  var mU = competition.match(/U-?\s*(\d{1,2})\b/i);
  if(mU) return "U"+mU[1];
  var mSub = competition.match(/sub-?\s*(\d{1,2})\b/i);
  if(mSub) return "Sub-"+mSub[1];
  return "";
}
function matchAgeGroup(m){
  return (m.ageGroup||"").trim() || deriveAgeGroupFromCompetition(m.competition);
}
function dashMatchRow(m){
  var modeText = m.observationMode==="VIDEO" ? "watch "+fmtDateShort(m.watchDate||m.date) : (m.time?esc(m.time):"");
  // A "To Watch"/"Scheduled" match whose date has already passed would otherwise just sit
  // wherever the ascending date sort puts it (usually near the top, but easy to miss) — flag it
  // so it can't be quietly forgotten. For a VIDEO match, "overdue" is judged against the day the
  // scout chose to watch it (agendaDateOf), not the real match date; LIVE/TV matches are judged
  // against their real date either way, since agendaDateOf falls back to m.date for those.
  var isOverdue = (m.status==="To Watch"||m.status==="Scheduled") && agendaDateOf(m) && agendaDateOf(m)<todayISO();
  // Desktop: club crests, with the competition in small gray text below the team names.
  // Mobile: no crests — the match's age group ("escalão") instead, no competition.
  var crestsHtml = '<div class="dash-match-crests" style="display:flex;align-items:center">'+crestHtml(clubById(m.homeClubId),20)+'<span style="margin:0 4px;color:var(--text-faint);font-size:11px">v</span>'+crestHtml(clubById(m.awayClubId),20)+'</div>';
  var ageGroupVal = matchAgeGroup(m);
  var ageGroupHtml = ageGroupVal ? '<span class="dash-match-agegroup badge">'+esc(ageGroupVal)+'</span>' : '';
  var competitionHtml = m.competition ? '<div class="dash-match-competition" style="font-size:10.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.competition)+'</div>' : '';
  return '<a class="roster-row" href="#/matches/'+encodeURIComponent(m.id)+'" style="text-decoration:none;justify-content:space-between">'+
    '<div style="display:flex;align-items:center;gap:8px;min-width:0">'+crestsHtml+ageGroupHtml+
    '<div style="min-width:0"><div class="roster-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(clubName(m.homeClubId))+' – '+esc(clubName(m.awayClubId))+'</div>'+competitionHtml+'</div></div>'+
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto">'+
      '<div style="display:flex;align-items:center;gap:6px">'+(isOverdue?'<span class="badge" style="background:var(--danger-soft);color:var(--danger)">Overdue</span>':'')+'<span class="mono" style="font-size:11.5px;color:var(--text-muted)">'+fmtDateShort(m.date)+'</span>'+badgeStatus(m.status)+'</div>'+
      '<div style="display:flex;align-items:center;gap:5px">'+badgeMode(m.observationMode)+(modeText?'<span class="mono" style="font-size:10px;color:var(--text-faint)">'+modeText+'</span>':'')+'</div>'+
    '</div></a>';
}
function dashPlayerRow(p){
  var by = birthYearOf(p);
  return '<a class="roster-row" href="#/players/'+encodeURIComponent(p.id)+'" style="text-decoration:none;justify-content:space-between">'+
    '<div style="display:flex;align-items:center;gap:9px;min-width:0">'+avatarHtml(p,28)+'<div style="min-width:0"><div class="roster-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</div><div class="roster-chars">'+esc(posLabel(p.firstPosition)||"")+(by?" · "+by:"")+(p.clubId?" · "+esc(clubName(p.clubId)):"")+'</div></div></div>'+
    '<div style="display:flex;align-items:center;gap:6px;flex:0 0 auto">'+(p.currentPerformance?ratingRing(p.currentPerformance,30):'')+(p.currentPotential?gradeRing(p.currentPotential,30):'')+'</div></a>';
}
function dashEvalRow(e){
  var p = playerById(e.playerId);
  if(!p) return "";
  var m = e.matchId ? matchById(e.matchId) : null;
  var right;
  if(m){
    // Highlight whichever side of the actual fixture is the evaluated player's own club —
    // no need to spell the club name out again separately.
    var homeName = esc(clubName(m.homeClubId)), awayName = esc(clubName(m.awayClubId));
    if(p.clubId && m.homeClubId===p.clubId) homeName = '<span style="color:var(--blue);font-weight:700">'+homeName+'</span>';
    else if(p.clubId && m.awayClubId===p.clubId) awayName = '<span style="color:var(--blue);font-weight:700">'+awayName+'</span>';
    right = '<div style="text-align:right;min-width:0;max-width:150px"><div class="roster-name" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+homeName+' – '+awayName+'</div><div class="roster-chars" style="text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.competition||"")+'</div></div>';
  } else {
    right = badgeRec(e.recommendation);
  }
  return '<a class="roster-row" href="#/players/'+encodeURIComponent(p.id)+'" style="text-decoration:none;justify-content:space-between">'+
    '<div style="display:flex;align-items:center;gap:9px;min-width:0">'+avatarHtml(p,28)+'<div style="min-width:0"><div class="roster-name">'+esc(p.name)+'</div><div class="roster-chars">'+badgeType(e.evaluationType)+' · '+fmtDateShort(e.date)+'</div></div></div>'+
    right+'</a>';
}

/* ============================================================
   PAGE: TEAMS - WATCH
   The full universe of teams comes from the SAFF fixture calendar synced into DB.fixtures (every
   team the "SAFF calendar" scheduled sync has ever seen play in the U15/U16/U17/U18/U21 domestic
   leagues) — not just the clubs already referenced by matches this scout has personally logged.
   A team (by age group) is listed if it has never been watched, or its last "Watched"/"Partially
   Watched" match is more than 2 months old — excluding any team that already has an upcoming
   ("To Watch"/"Scheduled") match for that same age group, since there's no need to flag a team
   that's already coming up.
   ============================================================ */
var TEAMS_WATCH_AGE_GROUPS = ["U15","U16","U17","U18","U21"];
var TEAMS_WATCH_EXPANDED = {}; // "<normName>|<ageGroup>" -> true when its upcoming-fixtures panel is open
function ageGroupSortKey(ag){
  var m = (ag||"").match(/(\d+)/);
  if(m) return parseInt(m[1],10);
  return 9999; // no discernible number (or no age group at all) -> sort last
}
// Ranks a competition's tier within its age group so Premier League teams sort above League
// Div.1 teams (and Div.2 below Div.1, etc.) — a competition without an explicit division number
// (Premier League itself, or a one-tier league like the U-21 Jawwy Elite League) ranks top (0).
function competitionTierRank(competition){
  var mDiv = (competition||"").match(/div(?:ision)?\.?\s*(\d+)/i);
  return mDiv ? parseInt(mDiv[1],10) : 0;
}
function teamsToWatch(){
  var cutoff = shiftMonthsISO(todayISO(),-2);
  var allowed = {}; TEAMS_WATCH_AGE_GROUPS.forEach(function(a){ allowed[a]=true; });
  // Universe: every (team, age group) the SAFF sync has ever recorded a fixture for, in the
  // domestic U15-U21 club leagues (national-team friendlies carry no club escalão to track).
  var universe = {}; // "<normName>|<ageGroup>" -> {name, ageGroup, competitions:{comp:true}}
  (DB.fixtures||[]).forEach(function(fx){
    if(/national|\bnt\b/i.test(fx.competition||"")) return; // national-team friendlies, not domestic club teams
    var ag = deriveAgeGroupFromCompetition(fx.competition);
    if(!allowed[ag]) return;
    [fx.team1,fx.team2].forEach(function(name){
      if(!name) return;
      var key = normName(name)+"|"+ag;
      if(!universe[key]) universe[key] = {name:name, ageGroup:ag, competitions:{}};
      if(fx.competition) universe[key].competitions[fx.competition] = true;
    });
  });
  // Cross-reference this scout's own tracked matches (watched / on the agenda) by the same
  // normalized-name + age-group key, so status lines up with the fixture universe above. Also
  // seeds the universe for a tracked team+age-group the SAFF sync hasn't (yet) surfaced a fixture
  // for, so nothing already being tracked ever silently drops off the list.
  var status = {}; // same key -> {lastWatched, hasUpcoming}
  DB.matches.forEach(function(m){
    var ag = matchAgeGroup(m);
    if(!allowed[ag]) return;
    [m.homeClubId,m.awayClubId].forEach(function(clubId){
      var name = clubName(clubId);
      if(!name) return;
      var key = normName(name)+"|"+ag;
      if(!universe[key]) universe[key] = {name:name, ageGroup:ag, competitions:{}};
      if(m.competition) universe[key].competitions[m.competition] = true;
      var s = status[key];
      if(!s){ s = {lastWatched:null, hasUpcoming:false}; status[key]=s; }
      if(m.status==="To Watch"||m.status==="Scheduled") s.hasUpcoming = true;
      if((m.status==="Watched"||m.status==="Partially Watched") && m.date && (!s.lastWatched||m.date>s.lastWatched)) s.lastWatched = m.date;
    });
  });
  var list = Object.keys(universe).map(function(key){
    var u = universe[key], s = status[key]||{lastWatched:null,hasUpcoming:false};
    var compNames = Object.keys(u.competitions).sort();
    var competition = compNames.join(", ");
    var tierRank = compNames.length ? Math.min.apply(null,compNames.map(competitionTierRank)) : 0;
    return {name:u.name, ageGroup:u.ageGroup, competition:competition, tierRank:tierRank, lastWatched:s.lastWatched, hasUpcoming:s.hasUpcoming};
  }).filter(function(g){
    if(g.hasUpcoming) return false;
    if(!g.lastWatched) return true; // never watched at all
    return g.lastWatched<cutoff; // watched, but more than 2 months ago
  });
  list.sort(function(a,b){
    var ka=ageGroupSortKey(a.ageGroup), kb=ageGroupSortKey(b.ageGroup);
    if(ka!==kb) return ka-kb;
    if(a.ageGroup!==b.ageGroup) return (a.ageGroup||"").localeCompare(b.ageGroup||"");
    if(a.tierRank!==b.tierRank) return a.tierRank-b.tierRank; // Premier League above League Div.1
    return a.name.localeCompare(b.name); // alphabetical within the same tier
  });
  return list;
}
// Every fixture still ahead (today or later) in the SAFF calendar involving this team, in this
// same age group — regardless of whether it's already been turned into a tracked match, so the
// "Add to Agenda" button (reused from the Calendar page) always reflects the real state.
function upcomingFixturesForTeam(name,ageGroup){
  var nn = normName(name);
  var today = todayISO();
  return (DB.fixtures||[]).filter(function(fx){
    if(fx.date<today) return false;
    if(deriveAgeGroupFromCompetition(fx.competition)!==ageGroup) return false;
    return normName(fx.team1)===nn || normName(fx.team2)===nn;
  }).sort(function(a,b){ return (a.date+(a.time||"")).localeCompare(b.date+(b.time||"")); });
}
function pageTeamsWatch(){
  var list = teamsToWatch();
  var html = '<div class="stack">';
  html += '<div class="section-head"><div><div class="eyebrow">Scouting</div><h1 style="font-size:24px">Teams - Watch</h1></div></div>';
  html += '<div style="font-size:12.5px;color:var(--text-muted);margin-top:-6px">Every U15-U21 SAFF team not watched in the last 2 months (or never watched) — teams already on your Agenda are left out.</div>';
  if(!list.length){
    html += '<div class="card card-pad">'+emptyRow("Nothing here — every team on the SAFF calendar is either recently watched or already on your Agenda.")+'</div>';
    html += '</div>';
    return html;
  }
  var order = [], byGroup = {};
  list.forEach(function(g){
    var key = g.ageGroup||"Other";
    if(!byGroup[key]){ byGroup[key]=[]; order.push(key); }
    byGroup[key].push(g);
  });
  order.forEach(function(key){
    var rows = byGroup[key].map(function(g){
      var rowKey = normName(g.name)+"|"+g.ageGroup;
      var sub = g.lastWatched ? "Last watched "+fmtDateShort(g.lastWatched) : "Never watched";
      var nameLine = esc(g.name)+(g.competition?' <span style="color:var(--text-faint);font-weight:400">· '+esc(g.competition)+'</span>':'');
      var expanded = !!TEAMS_WATCH_EXPANDED[rowKey];
      var fixtures = expanded ? upcomingFixturesForTeam(g.name,g.ageGroup) : [];
      var toggleLabel = expanded ? "Hide fixtures" : "Upcoming fixtures";
      var rowHtml = '<div class="roster-row" style="justify-content:flex-start">'+crestHtml({name:g.name},26)+
        '<div style="min-width:0;flex:1"><div class="roster-name">'+nameLine+'</div><div class="roster-chars">'+esc(sub)+'</div></div>'+
        '<button type="button" class="btn btn-sm" style="flex:0 0 auto" data-action="teams-watch-toggle-fixtures" data-key="'+escAttr(rowKey)+'">'+toggleLabel+'</button>'+
      '</div>';
      var fixturesHtml = "";
      if(expanded){
        fixturesHtml = '<div class="stack" style="padding:2px 0 8px 36px;gap:4px">'+
          (fixtures.length ? fixtures.map(function(fx){ return fixtureRow(fx,{showDate:true}); }).join("") :
            '<div style="font-size:11.5px;color:var(--text-faint);padding:4px 0">No upcoming fixtures found in the SAFF calendar for this team.</div>')+
        '</div>';
      }
      return rowHtml+fixturesHtml;
    }).join("");
    html += dashPanel(key,rows);
  });
  html += '</div>';
  return html;
}
ACTIONS["teams-watch-toggle-fixtures"] = function(el){
  var key = el.dataset.key;
  TEAMS_WATCH_EXPANDED[key] = !TEAMS_WATCH_EXPANDED[key];
  render();
};

function playerCompetitions(playerId){
  var comps = {};
  DB.matchPlayers.filter(function(mp){return mp.playerId===playerId;}).forEach(function(mp){
    var m = matchById(mp.matchId);
    if(m && m.competition) comps[m.competition]=true;
  });
  return Object.keys(comps);
}

function interestPlayerOptions(){

  return Object.keys(ids).map(playerById).filter(Boolean).sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(p){return {value:p.id,label:p.name};});

function pagePlayers(){
  var f = PLAYER_FILTERS;
  var dbPlayers = visiblePlayers();
  var rows = dbPlayers.map(function(p){
    return {p:p, born:birthYearOf(p), last:playerLastObserved(p.id), obs:playerObservationCount(p.id), comps:playerCompetitions(p.id)};
  });
  if(f.q){ var nn=normName(f.q); rows = rows.filter(function(r){return normName(r.p.name).indexOf(nn)>=0 || normName(clubName(r.p.clubId)).indexOf(nn)>=0 || normName(r.p.nationality||"").indexOf(nn)>=0 || normName(r.p.nationality2||"").indexOf(nn)>=0;}); }
  if(f.position.length) rows = rows.filter(function(r){return f.position.indexOf(r.p.firstPosition)>=0 || (r.p.secondPosition && f.position.indexOf(r.p.secondPosition)>=0);});
  if(f.club.length) rows = rows.filter(function(r){return f.club.indexOf(r.p.clubId)>=0;});
  if(f.nationality.length) rows = rows.filter(function(r){return f.nationality.indexOf(r.p.nationality)>=0 || (r.p.nationality2 && f.nationality.indexOf(r.p.nationality2)>=0);});
  if(f.foot.length) rows = rows.filter(function(r){return f.foot.indexOf(r.p.preferredFoot)>=0;});
  if(f.birthYear.length) rows = rows.filter(function(r){return r.born!==null && f.birthYear.indexOf(String(r.born))>=0;});
  if(f.performance.length) rows = rows.filter(function(r){return f.performance.indexOf(String(r.p.currentPerformance))>=0;});
  if(f.potential.length) rows = rows.filter(function(r){return f.potential.indexOf(String(r.p.currentPotential))>=0;});
  if(f.competition.length) rows = rows.filter(function(r){return r.comps.some(function(c){return f.competition.indexOf(c)>=0;});});
  if(f.status.length) rows = rows.filter(function(r){return f.status.indexOf(r.p.status||"")>=0;});
  rows.sort(function(a,b){
    var dir = f.sortDir==="asc"?1:-1;
    function val(r){
      switch(f.sortBy){
        case "position": return positionSortRank(r.p.firstPosition);
        case "born": return r.born===null?-1:r.born;
        case "club": return normName(clubName(r.p.clubId));
        case "nationality": return normName(r.p.nationality||"");
        case "performance": return r.p.currentPerformance===""?-1:parseFloat(r.p.currentPerformance||0);
        case "potential": return r.p.currentPotential?(GRADE_RANK[normalizeGrade(r.p.currentPotential)]||-1):-1;
        case "last": return r.last||"";
        case "status": return normName(r.p.status||"");
        default: return normName(r.p.name);
      }
    }
    var av=val(a), bv=val(b);
    if(av<bv) return -1*dir; if(av>bv) return 1*dir;
    // The default database order (sorted by position): break ties by age, oldest (earliest birth
    // year) first — unknown birth years sort last, regardless of the position column's direction.
    if(f.sortBy==="position"){
      var aBorn = a.born===null?Infinity:a.born, bBorn = b.born===null?Infinity:b.born;
      if(aBorn!==bBorn) return aBorn<bBorn?-1:1;
    }
    return normName(a.p.name) < normName(b.p.name) ? -1 : (normName(a.p.name) > normName(b.p.name) ? 1 : 0);
  });

  var nationalities = Array.from(new Set(dbPlayers.map(function(p){return p.nationality;}).concat(dbPlayers.map(function(p){return p.nationality2;})).filter(Boolean))).sort();
  var birthYears = Array.from(new Set(dbPlayers.map(function(p){return birthYearOf(p);}).filter(function(y){return y!==null;}))).sort(function(a,b){return b-a;});
  var perfValues = Array.from(new Set(dbPlayers.map(function(p){return p.currentPerformance;}).filter(function(v){return v!==""&&v!==undefined&&v!==null;}))).sort(function(a,b){return parseFloat(a)-parseFloat(b);});
  var potValues = Array.from(new Set(dbPlayers.map(function(p){return normalizeGrade(p.currentPotential);}).filter(Boolean))).sort(function(a,b){return GRADE_RANK[b]-GRADE_RANK[a];});
  var clubOptions = DB.clubs.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(c){return {value:c.id,label:c.name};});

  var html = '<div class="stack">';

  html += '<div style="margin-bottom:8px"><input class="input" style="width:280px;min-height:36px;border-radius:99px" id="pf_q" placeholder="Search name, club, nationality…" value="'+escAttr(f.q)+'"></div>';
  html += '<div class="filterbar">';
  html += renderMSF("players","position","Position",POSITIONS);
  html += renderMSF("players","status",STATUS_FIELD_LABEL,PLAYER_STATUSES);
  html += renderMSF("players","club","Club",clubOptions);
  html += renderMSF("players","nationality","Nationality",nationalities);
  html += renderMSF("players","foot","Foot",FEET);
  html += renderMSF("players","birthYear","Birth Year",birthYears);
  html += renderMSF("players","performance","Performance",perfValues);
  html += renderMSF("players","potential","Potential",potValues);
  if(f.q||msfActive(f)) html += '<button class="filter-toggle" id="pf_clear">Clear all</button>';
  html += '</div>';

  if(!rows.length){
    html += '<div class="card"><div class="empty-state"><h3>'+(dbPlayers.length?"No players match these filters":"Your Players Database is empty")+'</h3><p>'+(dbPlayers.length?"Try clearing a filter.":"Add a player manually, or mark one as a Player of Interest from a match lineup — that’s when they land here.")+'</p><a class="btn btn-primary" href="#/players/new">'+ic("plus")+' Add Player</a></div></div>';
  } else {
    html += '<div class="table-wrap"><table class="table-compact"><thead><tr>'+
      '<th style="width:28px"></th>'+
      th("Name","name",f)+
      th("Pos","position",f)+
      th("Born","born",f)+
      th("Club","club",f)+
      th("Nationality","nationality",f)+
      '<th>Foot</th>'+
      th("Performance","performance",f)+
      th("Potential","potential",f)+
      th(STATUS_FIELD_LABEL,"status",f)+
      th("Last Observed","last",f)+
      '<th></th>'+
      '</tr></thead><tbody>';
    rows.forEach(function(r){
      var p=r.p;
      html += '<tr class="clickable" data-nav-row="#/players/'+encodeURIComponent(p.id)+'">'+
        '<td><div style="display:flex;align-items:center;justify-content:center">'+avatarHtmlByPosition(p,22)+'</div></td>'+
        '<td><div style="font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">'+playerDisplayName(p)+'</div></td>'+
        '<td>'+badgePos(p.firstPosition)+' '+(p.secondPosition?badgePos(p.secondPosition):'')+'</td>'+
        '<td class="num mono">'+(r.born===null?"—":r.born)+'</td>'+
        '<td><div style="display:flex;align-items:center;justify-content:center;gap:6px">'+crestHtml(clubById(p.clubId),16)+(p.clubId?esc(clubName(p.clubId)):'<span style="color:var(--text-faint)">Free Agent</span>')+'</div></td>'+
        '<td style="font-size:19px">'+(p.nationality?flagHtml(p.nationality,false)+(p.nationality2?" "+flagHtml(p.nationality2,false):""):'<span style="color:var(--text-faint);font-size:13px">—</span>')+'</td>'+
        '<td class="mono">'+esc(footAbbrev(p.preferredFoot))+'</td>'+
        '<td class="num">'+(p.currentPerformance?'<span style="font-weight:700;color:'+performanceColor(p.currentPerformance)+'">'+Number(p.currentPerformance).toFixed(0)+'</span>':'<span style="color:var(--text-faint)">—</span>')+'</td>'+
        '<td class="num">'+(p.currentPotential?gradeBadge(p.currentPotential):'<span style="color:var(--text-faint)">—</span>')+'</td>'+
        '<td>'+(p.status?'<span class="badge" style="background:var(--surface-3);color:var(--text-muted)">'+esc(p.status)+'</span>':'<span style="color:var(--text-faint)">—</span>')+'</td>'+
        '<td class="mono" style="font-size:12px">'+(r.last?fmtDateShort(r.last):"—")+'</td>'+
        '<td><button class="icon-btn" data-action="delete-player" data-id="'+p.id+'" title="Delete player">'+ic("trash")+'</button></td>'+
        '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  onAfterRender(function(){

    var clearEl=document.getElementById("pf_clear");
    if(clearEl) clearEl.addEventListener("click",function(){ PLAYER_FILTERS={q:"",position:[],club:[],nationality:[],foot:[],birthYear:[],performance:[],potential:[],competition:[],status:[],sortBy:"position",sortDir:"asc"}; MSF_OPEN_PANEL=null; render(); });
    document.querySelectorAll("[data-sort]").forEach(function(th){
      th.addEventListener("click",function(){
        var key=th.dataset.sort;
        if(PLAYER_FILTERS.sortBy===key){ PLAYER_FILTERS.sortDir = PLAYER_FILTERS.sortDir==="asc"?"desc":"asc"; }
        else { PLAYER_FILTERS.sortBy=key; PLAYER_FILTERS.sortDir="asc"; }

FORM_HANDLERS["save-player"] = function(form){
  var fd = new FormData(form);
  var id = form.dataset.id;
  var isEdit = !!id;
  var vals = {
    name:(fd.get("name")||"").trim(),
    firstPosition:fd.get("firstPosition")||"",
    secondPosition:fd.get("secondPosition")||"",
    birthYear:fd.get("birthYear")||"",
    dob:fd.get("dob")||"",
    clubId:fd.get("clubId")||"",
    nationality:(fd.get("nationality")||"").trim(),
    // nationality2 is intentionally not part of this form — it's set later via inline-edit on
    // the player's own profile page, so it's never touched (and never wiped) here.
    preferredFoot:fd.get("preferredFoot")||"",
    height:fd.get("height")||"",
    agent:(fd.get("agent")||"").trim(),
    photo:(fd.get("photo")||"").trim(),
    characteristics:fd.get("characteristics")||"",
    extraObservations:fd.get("extraObservations")||"",
    currentPerformance:fd.get("currentPerformance")||"",
    currentPotential:fd.get("currentPotential")||"",
    status:fd.get("status")||""
  };
  if(!vals.name) return;
  var evaluationType = fd.get("evaluationType")||"Manual";
  if(isEdit){
    var p = playerById(id);
    Object.assign(p,vals);
    if(vals.height) p.heightUpdatedAt = todayISO();
    if(vals.firstPosition) p.positionUpdatedAt = todayISO();
    p.updatedAt = nowISO();
    persist({toast:"Player updated", redirectHash:"#/players/"+encodeURIComponent(p.id)});
    return;
  }
  function createNewPlayer(){
    var np = Object.assign({id:uid("player")},vals,{createdAt:nowISO(),updatedAt:nowISO()});
    if(vals.height) np.heightUpdatedAt = todayISO();
    if(vals.firstPosition) np.positionUpdatedAt = todayISO();
    DB.players.push(np);
    if(vals.currentPerformance || vals.currentPotential){
      DB.evaluations.push({
        id:uid("eval"),playerId:np.id,matchId:null,evaluationType:evaluationType,date:todayISO(),
        performance:vals.currentPerformance,potential:vals.currentPotential,
        characteristics:vals.characteristics,observations:"Initial baseline evaluation at profile creation.",
        recommendation:"",scoutId:DB.currentScoutId,createdAt:nowISO()
      });
    }
    persist({toast:"Player successfully added to Players Database", redirectHash:"#/players/"+encodeURIComponent(np.id)});
  }
  // Same name already in the Players Database (or seen in another match's lineup, since every
  // player observed anywhere ends up in DB.players) — could be this exact player, could be a
  // namesake. Offer to link to the existing record instead of quietly creating a duplicate.
  var candidates = findPlayerCandidates(vals.name,vals.clubId,vals.nationality,vals.birthYear);
  if(candidates.length){
    openDuplicateModal(candidates,function(res){
      if(res.type==="existing"){
        var existing = playerById(res.playerId);
        if(!existing) return;
        // Link to the existing player: fill in whatever they were missing, never overwrite what's
        // already on file — same fill-if-missing rule used everywhere else in the app.
        ["firstPosition","secondPosition","birthYear","dob","clubId","nationality","preferredFoot","agent","photo","characteristics","extraObservations","status"].forEach(function(k){
          if(vals[k] && !existing[k]) existing[k] = vals[k];
        });
        applyLatestPlayerField(existing,"height","heightUpdatedAt",vals.height,todayISO());
        applyLatestPlayerField(existing,"firstPosition","positionUpdatedAt",vals.firstPosition,todayISO());
        existing.updatedAt = nowISO();
        if(vals.currentPerformance || vals.currentPotential){
          DB.evaluations.push({
            id:uid("eval"),playerId:existing.id,matchId:null,evaluationType:evaluationType,date:todayISO(),
            performance:vals.currentPerformance,potential:vals.currentPotential,
            characteristics:vals.characteristics,observations:"",recommendation:"",
            scoutId:DB.currentScoutId,createdAt:nowISO()
          });
          updatePlayerCurrentRatings(existing.id);
        }
        persist({toast:"Linked to existing player", redirectHash:"#/players/"+encodeURIComponent(existing.id)});
      } else {
        createNewPlayer();
      }
    });
  } else {
    createNewPlayer();
  }
};

function ratingCard(label,field,p){
  var v = p[field];
  var isGrade = (field==="currentPotential");
  var ring = isGrade ? gradeRing(v,64) : ratingRing(v,64);
  var color = isGrade ? gradeColor(v) : ratingColor(v);
  var big = isGrade ? (normalizeGrade(v)||"–") : (v?Number(v).toFixed(0):"–");
  var suffix = isGrade ? "" : ' <span style="font-size:14px;color:var(--text-faint);font-weight:600">/ 5</span>';
  return '<div class="card card-pad" style="display:flex;align-items:center;gap:16px">'+ring+
    '<div><div class="eyebrow">'+label+'</div><div style="font-family:var(--font-display);font-weight:800;font-size:26px;color:'+color+'">'+big+suffix+'</div></div>'+
  '</div>';
}
function sparkBlock(label,evals){
  var isGrade = (label==="Potential");
  var series = evals.slice().reverse().map(function(e){return {date:e.date, v: label==="Performance"?e.performance:e.potential};}).filter(function(x){return x.v!==""&&x.v!==null&&x.v!==undefined;});
  if(series.length<2) return '<div class="spark-block"><div class="eyebrow">'+label+'</div><div style="color:var(--text-faint);font-size:12px;padding:10px 0">Not enough data yet</div></div>';
  var w=260,h=54,pad=6;
  var vals = series.map(function(s){return isGrade ? (GRADE_RANK[normalizeGrade(s.v)]||0) : parseFloat(s.v);});
  var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
  if(min===max){ min-=1; max+=1; }
  var pts = series.map(function(s,i){
    var x = pad + (i/(series.length-1))*(w-pad*2);
    var val = isGrade ? (GRADE_RANK[normalizeGrade(s.v)]||0) : parseFloat(s.v);
    var y = h-pad - ((val-min)/(max-min))*(h-pad*2);
    return [x,y];
  });
  var path = pts.map(function(pt,i){return (i===0?"M":"L")+pt[0].toFixed(1)+","+pt[1].toFixed(1);}).join(" ");
  var last = pts[pts.length-1];
  var color = label==="Performance" ? "var(--accent)" : "var(--gold)";
  var areaPath = path+" L"+last[0].toFixed(1)+","+(h-pad)+" L"+pts[0][0].toFixed(1)+","+(h-pad)+" Z";
  var lastLabel = isGrade ? normalizeGrade(series[series.length-1].v) : vals[vals.length-1].toFixed(0);
  return '<div class="spark-block"><div class="eyebrow">'+label+'</div>'+
    '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="overflow:visible;margin-top:4px">'+
    '<path d="'+areaPath+'" fill="'+color+'" opacity="0.12" stroke="none"/>'+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="'+color+'"/>'+
    '</svg><div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);margin-top:2px"><span>'+fmtDateShort(series[0].date)+'</span><span class="mono" style="color:'+color+';font-weight:600">'+lastLabel+'</span></div></div>';
}

  if(matchId && position){
    var mp = DB.matchPlayers.find(function(x){return x.matchId===matchId && x.playerId===playerId;});
    if(mp) mp.position = position;

  if(f.club.length) rows = rows.filter(function(r){return f.club.indexOf(r.m.homeClubId)>=0 || f.club.indexOf(r.m.awayClubId)>=0;});
  if(f.players.length) rows = rows.filter(function(r){return DB.matchPlayers.some(function(mp){return mp.matchId===r.m.id && mp.playerOfInterest && f.players.indexOf(mp.playerId)>=0;});});

        default: return (r.m.date||"")+(r.m.time||"");

  } else {

      th("Date","date",f)+'<th>Time</th>'+th("Fixture","home",f)+th("Competition","competition",f)+'<th>Matchday</th><th>Mode</th>'+th("Status","status",f)+'<th>Players</th><th></th></tr></thead><tbody>';

function fixtureById(id){ return byId(DB.fixtures,id); }
function getOrCreateClubByName(name){
  name = (name||"").trim();
  if(!name) return null;
  var nn = normName(name);
  var existing = DB.clubs.find(function(c){ return normName(c.name)===nn; });
  if(existing) return existing;
  var club = {id:uid("club"),name:name,country:"",logo:"",createdAt:nowISO()};
  DB.clubs.push(club);
  return club;
}
function addFixtureToAgenda(fixtureId,opts){
  var fx = fixtureById(fixtureId);
  if(!fx || fx.matchId) return null;
  opts = opts || {};
  var home = getOrCreateClubByName(fx.team1);
  var away = getOrCreateClubByName(fx.team2);
  var mode = opts.observationMode || "LIVE";
  var m = {
    id:uid("match"), homeClubId:home.id, awayClubId:away.id,
    date:fx.date, time:fx.time, competition:fx.competition, matchday:"",
    observationMode:mode, status:"To Watch",
    watchDate: (mode==="VIDEO" && opts.watchDate) ? opts.watchDate : "",
    matchObservations:"",
    venue:fx.venue||"", fromCalendar:true, fixtureId:fx.id,
    createdAt:nowISO(), updatedAt:nowISO()
  };
  DB.matches.push(m);
  fx.matchId = m.id;
  // SAFF calendar fixtures never carry a country of their own — they're all Saudi Arabian
  // competitions, so default it here (unless the scout already set something different for
  // this exact competition name) rather than leaving the abbreviation permanently blank.
  if(fx.competition && !DB.competitionCountries[fx.competition]) DB.competitionCountries[fx.competition] = "Saudi Arabia";
  return m;
}

function fmtDateLong(iso){
  if(!iso) return "—";
  var d = new Date(iso+"T00:00:00");
  if(isNaN(d.getTime())) return iso;
  var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return days[d.getDay()]+" "+d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
}

var AGENDA_MONTH = todayISO().slice(0,7);
function isoLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function monthGridWeeks(yyyymm){
  var parts=yyyymm.split("-"); var y=parseInt(parts[0],10), mo=parseInt(parts[1],10)-1;
  var first=new Date(y,mo,1);
  var startOffset=(first.getDay()+6)%7; // 0=Mon
  var cur=new Date(y,mo,1-startOffset);
  var weeks=[];
  for(var w=0; w<6; w++){
    var week=[];
    for(var d=0; d<7; d++){
      week.push({date:isoLocal(cur), inMonth:cur.getMonth()===mo});
      cur.setDate(cur.getDate()+1);
    }
    weeks.push(week);
  }
  while(weeks.length>4 && weeks[weeks.length-1].every(function(c){return !c.inMonth;})){ weeks.pop(); }
  return weeks;
}
function monthLabel(yyyymm){
  var parts=yyyymm.split("-");
  var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return months[parseInt(parts[1],10)-1]+" "+parts[0];
}
function shiftMonth(yyyymm,delta){
  var parts=yyyymm.split("-"); var d=new Date(parseInt(parts[0],10),parseInt(parts[1],10)-1+delta,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function agendaDateOf(m){ return (m.observationMode==="VIDEO" && m.watchDate) ? m.watchDate : m.date; }
function pageAgenda(){
  var scheduled = DB.matches.filter(function(m){return m.fromCalendar;}).sort(function(a,b){return (agendaDateOf(a)+(a.time||"")).localeCompare(agendaDateOf(b)+(b.time||""));});
  var tasks = DB.agendaTasks.slice().sort(function(a,b){
    var ad=a.done?1:0, bd=b.done?1:0;
    if(ad!==bd) return ad-bd;
    return (a.dueDate||"9999").localeCompare(b.dueDate||"9999") || (a.dueTime||"99:99").localeCompare(b.dueTime||"99:99");
  });
  var byDay = {};
  scheduled.forEach(function(m){ (byDay[agendaDateOf(m)]=byDay[agendaDateOf(m)]||{matches:[],tasks:[]}).matches.push(m); });
  tasks.forEach(function(t){ if(!t.dueDate) return; (byDay[t.dueDate]=byDay[t.dueDate]||{matches:[],tasks:[]}).tasks.push(t); });
  var today = todayISO();
  var weeks = monthGridWeeks(AGENDA_MONTH);
  var weekdayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  var html = '<div class="stack">';
  html += '<div class="section-head"><div><div class="eyebrow">'+scheduled.length+' scheduled · '+tasks.filter(function(t){return !t.done;}).length+' open tasks</div><h1 style="font-size:22px">Agenda</h1></div><a class="btn" href="#/calendar">'+ic("calendar")+' Browse Calendar</a></div>';

  // MONTH GRID
  html += '<div class="card card-pad">';
  html += '<div class="cal-nav"><button class="cal-nav-btn" data-action="agenda-month-prev" title="Previous month"><span style="display:inline-block;transform:rotate(180deg)">'+ic("chev")+'</span></button>'+
    '<div style="font-family:var(--font-display);font-weight:700;font-size:16px">'+monthLabel(AGENDA_MONTH)+'</div>'+
    '<div style="display:flex;gap:8px;align-items:center">'+(AGENDA_MONTH!==today.slice(0,7)?'<button class="filter-toggle" data-action="agenda-month-today" style="min-height:30px;padding:4px 10px;font-size:11.5px">Today</button>':'')+
    '<button class="cal-nav-btn" data-action="agenda-month-next" title="Next month">'+ic("chev")+'</button></div>'+
  '</div>';
  html += '<div class="cal-grid-wrap"><div class="cal-grid">';
  weekdayNames.forEach(function(wd){ html += '<div class="cal-grid-head">'+wd+'</div>'; });
  var CAL_CELL_CAP = 3;
  weeks.forEach(function(week){
    week.forEach(function(cell){
      var info = byDay[cell.date] || {matches:[],tasks:[]};
      var dayNum = parseInt(cell.date.slice(8,10),10);
      var totalItems = info.matches.length + info.tasks.length;
      html += '<div class="cal-cell'+(cell.inMonth?"":" out-month")+(cell.date===today?" today":"")+'">';
      if(totalItems>0){
        html += '<button type="button" class="cal-cell-date cal-cell-date-btn" data-action="open-agenda-day" data-date="'+cell.date+'" title="View all for this day">'+dayNum+'</button>';
      } else {
        html += '<div class="cal-cell-date">'+dayNum+'</div>';
      }
      var shown = 0;
      info.matches.forEach(function(m){
        if(shown>=CAL_CELL_CAP) return;
        var watched = m.status==="Watched"||m.status==="Partially Watched";
        var chipModeClass = watched ? "cal-chip-match-watched" : "cal-chip-mode-"+(m.observationMode||"LIVE");
        var showChipTime = m.time && m.observationMode!=="VIDEO";
        html += '<div class="cal-chip '+chipModeClass+'" data-action="open-match-preview" data-id="'+m.id+'" title="'+escAttr(clubName(m.homeClubId)+' v '+clubName(m.awayClubId))+'">'+(showChipTime?esc(m.time)+' ':'')+esc(clubName(m.homeClubId))+' v '+esc(clubName(m.awayClubId))+'</div>';
        shown++;
      });
      info.tasks.forEach(function(t){
        if(shown>=CAL_CELL_CAP) return;
        html += '<div class="cal-chip cal-chip-task'+(t.done?" done":"")+'" data-action="open-task-preview" data-id="'+t.id+'" title="'+escAttr(t.text)+'">'+(t.dueTime?esc(t.dueTime)+' ':'')+esc(t.text)+'</div>';
        shown++;
      });
      if(totalItems>CAL_CELL_CAP){
        html += '<button type="button" class="cal-cell-more" data-action="open-agenda-day" data-date="'+cell.date+'">+'+(totalItems-CAL_CELL_CAP)+' more</button>';
      }
      html += '<button class="cal-cell-add" data-action="open-add-task" data-date="'+cell.date+'" title="Add to '+cell.date+'">'+ic("plus")+'</button>';
      html += '</div>';
    });
  });
  html += '</div></div></div>';

  html += '<details class="acc"><summary>'+ic("agenda")+' <span style="margin-left:6px">Scheduled Matches</span><span class="count-chip">'+scheduled.length+'</span><span class="chev">'+ic("chev")+'</span></summary><div class="acc-body" style="padding-top:10px">';
  if(!scheduled.length){
    html += emptyRow("No matches scheduled yet. Pick games to watch from the Calendar.","Browse Calendar","#/calendar");
  } else {

FORM_HANDLERS["save-match"] = function(form){
  var fd = new FormData(form);
  var id = form.dataset.id;
  var isEdit = !!id;
  var vals = {
    homeClubId: fd.get("homeClubId")||"",
    awayClubId: fd.get("awayClubId")||"",
    date: fd.get("date")||todayISO(),
    time: fd.get("time")||"",
    competition: (fd.get("competition")||"").trim(),
    matchday: (fd.get("matchday")||"").trim(),
    ageGroup: (fd.get("ageGroup")||"").trim(),
    observationMode: fd.get("observationMode")||"LIVE",
    status: fd.get("status")||"To Watch",
    watchDate: fd.get("watchDate")||""
  };
  if(vals.observationMode!=="VIDEO") vals.watchDate = "";
  if(!vals.homeClubId || !vals.awayClubId){ showToastImmediate("Please select or create both a Home Team and an Away Team."); return; }
  // only ever set/overwrite — an intentionally-blank field never erases a country already
  // recorded for this competition name from an earlier match.
  var competitionCountry = (fd.get("competitionCountry")||"").trim();
  if(vals.competition && competitionCountry) DB.competitionCountries[vals.competition] = competitionCountry;
  var m;
  if(isEdit){
    m = matchById(id);
    Object.assign(m,vals);
    m.updatedAt = nowISO();
    persist({toast:"Match updated", redirectHash:"#/matches/"+encodeURIComponent(m.id)});
  } else {
    m = Object.assign({id:uid("match"),matchObservations:""},vals,{createdAt:nowISO(),updatedAt:nowISO()});
    DB.matches.push(m);
    persist({toast:"Match created — add your lineups", redirectHash:"#/matches/"+encodeURIComponent(m.id)});
  }
};

/* ============================================================

var ROLE_LINE = {GK:"GK",CB:"DEF",LB:"DEF",RB:"DEF",LWB:"DEF",RWB:"DEF",DM:"MID",CM:"MID",AM:"MID",LM:"MID",RM:"MID",LW:"FWD",RW:"FWD",SS:"FWD",CF:"FWD",ST:"FWD"};
var ROLE_SIDE = {LB:0,LWB:0,LM:0,LW:0,RB:2,RWB:2,RM:2,RW:2};
// Selectable tactical formations: always exactly 11 slots per formation, always shown, tap-to-edit
var FORMATIONS = {
  "4-3-3": [
    {pos:"GK", x:50, y:91},
    {pos:"LB", x:14, y:70}, {pos:"CB", x:38, y:73}, {pos:"CB", x:62, y:73}, {pos:"RB", x:86, y:70},

    {pos:"LM", x:14, y:42}, {pos:"CM", x:38, y:46}, {pos:"CM", x:62, y:46}, {pos:"RM", x:86, y:42},
    {pos:"ST", x:38, y:18}, {pos:"ST", x:62, y:18}
  ],
  "4-2-3-1": [
    {pos:"GK", x:50, y:91},
    {pos:"LB", x:14, y:72}, {pos:"CB", x:38, y:74}, {pos:"CB", x:62, y:74}, {pos:"RB", x:86, y:72},
    {pos:"DM", x:35, y:54}, {pos:"CM", x:65, y:54},
    {pos:"LW", x:16, y:35}, {pos:"AM", x:50, y:33}, {pos:"RW", x:84, y:35},
    {pos:"CF", x:50, y:13, sideSubs:true}
  ],
  "3-4-3": [
    {pos:"GK", x:50, y:91},
    {pos:"CB", x:30, y:74}, {pos:"CB", x:50, y:77}, {pos:"CB", x:70, y:74},
    {pos:"LM", x:14, y:48}, {pos:"CM", x:38, y:50}, {pos:"CM", x:62, y:50}, {pos:"RM", x:86, y:48},
    {pos:"LW", x:16, y:19}, {pos:"CF", x:50, y:16}, {pos:"RW", x:84, y:19}
  ]
};
var FORMATION_KEYS = ["3-5-2","3-4-3","4-3-3","4-4-2","4-2-3-1"];
function formationKeyFor(m,clubId){
  var key = (clubId===m.awayClubId) ? m.awayFormation : m.homeFormation;
  return (key && FORMATIONS[key]) ? key : "4-3-3";
}
function formationFor(m,clubId){ return FORMATIONS[formationKeyFor(m,clubId)]; }
// Does this lineup entry carry any information beyond number/position/name — characteristics,
// a note, or a graded match evaluation? Shown as a small asterisk on the jersey (any player,
// not just Players of Interest) so it's obvious at a glance who already has notes worth reading.
function mpHasExtraInfo(mp){
  if(mp.matchCharacteristics && String(mp.matchCharacteristics).trim()) return true;
  if(mp.interestNote && String(mp.interestNote).trim()) return true;
  var ev = DB.evaluations.find(function(e){return e.playerId===mp.playerId && e.matchId===mp.matchId && e.evaluationType==="Match";});
  if(ev && (ev.performance || ev.potential)) return true;
  return false;
}
function pitchJerseyHtml(mp,matchId,clubId,slotIndex,isSub){
  var p = playerById(mp.playerId);
  // Players of Interest get a star (matching the star used everywhere else in the app for POI);
  // everyone else with notes/characteristics/a graded evaluation gets a plain asterisk — so the
  // two are visually distinct at a glance.
  var infoMark = mp.playerOfInterest
    ? '<span class="pitch-jersey-info-mark pitch-jersey-star-mark" title="Player of Interest">'+ic("star")+'</span>'
    : (mpHasExtraInfo(mp) ? '<span class="pitch-jersey-info-mark" title="Has notes/evaluation">*</span>' : '');
  var wasSubbedOff = DB.matchPlayers.some(function(x){return x.matchId===matchId && x.replacedPlayerId===mp.id;});
  var offMark = wasSubbedOff ? '<span class="pitch-jersey-off-mark" title="Substituted off">→</span>' : '';
  return '<div class="pitch-jersey'+(isSub?" pitch-jersey-sub":"")+'" data-action="open-pitch-slot" data-match-id="'+matchId+'" data-club-id="'+clubId+'" data-slot="'+slotIndex+'" data-mp-id="'+mp.id+'">'+
    '<span class="pitch-jersey-num">'+esc(mp.shirtNumber||"–")+infoMark+offMark+'</span>'+
    '<span class="pitch-jersey-name">'+esc(shortPlayerName(p?p.name:""))+'</span>'+
  '</div>';
}
function pitchFormation(m,clubId){
  var slots = formationFor(m,clubId);
  var all = matchLineup(m.id,clubId);
  var explicit = all.filter(function(mp){ return typeof mp.slotIndex==="number" && mp.slotIndex>=0 && mp.slotIndex<slots.length; });
  var legacy = all.filter(function(mp){ return explicit.indexOf(mp)===-1; });
  var bySlot = {};
  explicit.forEach(function(mp){
    if(!bySlot[mp.slotIndex]) bySlot[mp.slotIndex] = {starter:null, subs:[]};
    if(mp.lineupStatus!=="Substitute" && !bySlot[mp.slotIndex].starter){ bySlot[mp.slotIndex].starter = mp; }
    else { bySlot[mp.slotIndex].subs.push(mp); }
  });
  // Backward compatibility: players added before per-slot tracking existed have no slotIndex.
  // Slot them dynamically into whatever pitch slots are still free, same as the old algorithm.
  var legacyStarters = legacy.filter(function(mp){ return mp.lineupStatus!=="Substitute"; });
  var legacyOther = legacy.filter(function(mp){ return mp.lineupStatus==="Substitute"; });
  if(legacyStarters.length){
    var lines = {GK:[],DEF:[],MID:[],FWD:[]};
    legacyStarters.forEach(function(mp){
      var p = playerById(mp.playerId);
      var pos = mp.position || (p?p.firstPosition:"") || "";
      var line = ROLE_LINE[pos] || "MID";
      lines[line].push(mp);
    });
    ["GK","DEF","MID","FWD"].forEach(function(line){
      lines[line].sort(function(a,b){
        var pa = a.position || (playerById(a.playerId)||{}).firstPosition || "";
        var pb = b.position || (playerById(b.playerId)||{}).firstPosition || "";
        var sa = ROLE_SIDE[pa]!==undefined?ROLE_SIDE[pa]:1, sb = ROLE_SIDE[pb]!==undefined?ROLE_SIDE[pb]:1;
        if(sa!==sb) return sa-sb;
        return (parseInt(a.shirtNumber,10)||99)-(parseInt(b.shirtNumber,10)||99);
      });
    });
    var nominal = {GK:[],DEF:[],MID:[],FWD:[]};
    slots.forEach(function(slot,i){ if(!bySlot[i] || !bySlot[i].starter){ nominal[ROLE_LINE[slot.pos]||"MID"].push(i); } });
    ["GK","DEF","MID","FWD"].forEach(function(line){
      var lineSlots = nominal[line], list = lines[line];
      lineSlots.forEach(function(slotIdx,i){
        if(list[i]){
          if(!bySlot[slotIdx]) bySlot[slotIdx] = {starter:null,subs:[]};
          bySlot[slotIdx].starter = list[i];
        }
      });
      if(list.length>lineSlots.length){ legacyOther = legacyOther.concat(list.slice(lineSlots.length)); }
    });
  }
  var jerseys = "";
  slots.forEach(function(slot,i){
    var cell = bySlot[i] || {starter:null,subs:[]};
    var stackHtml = "";
    // Slots flagged sideSubs (e.g. the lone CF in 4-2-3-1, sitting right under the AM slot) keep
    // the starter exactly on its marked spot and place any substitutes beside it instead of
    // stacking them underneath, where they'd overlap the slot above.
    var sideHtml = "";
    function addSub(sub,idx){
      if(slot.sideSubs){
        var offsetX = Math.min(96, slot.x + 14*(idx+1));
        sideHtml += '<div class="pitch-slot-stack" style="left:'+offsetX+'%;top:'+slot.y+'%">'+pitchJerseyHtml(sub,m.id,clubId,i,true)+'</div>';
      } else {
        stackHtml += pitchJerseyHtml(sub,m.id,clubId,i,true);
      }
    }
    if(cell.starter){
      stackHtml += pitchJerseyHtml(cell.starter,m.id,clubId,i,false);
      cell.subs.forEach(addSub);
      stackHtml += '<button type="button" class="pitch-add-sub" data-action="open-pitch-slot-sub" data-match-id="'+m.id+'" data-club-id="'+clubId+'" data-slot="'+i+'" title="Add substitute">'+ic("plus")+'</button>';
    } else {
      // No starter in this slot (e.g. the starter was removed while a substitute was still here) —
      // keep any substitute visible and reachable instead of hiding it behind the empty "add" slot,
      // so removing one player never makes another one disappear from the pitch.
      stackHtml += '<div class="pitch-jersey pitch-empty" data-action="open-pitch-slot" data-match-id="'+m.id+'" data-club-id="'+clubId+'" data-slot="'+i+'">'+
        '<span class="pitch-jersey-num">'+ic("plus")+'</span>'+
        '<span class="pitch-jersey-name">'+slot.pos+'</span>'+
      '</div>';
      cell.subs.forEach(addSub);
    }
    jerseys += '<div class="pitch-slot-stack" style="left:'+slot.x+'%;top:'+slot.y+'%">'+stackHtml+'</div>'+sideHtml;
  });
  var overflowNote = legacyOther.length ? '<div class="field-hint" style="margin-top:6px">+'+legacyOther.length+' player'+(legacyOther.length===1?"":"s")+' from before the pitch redesign — open them from the Players Database.</div>' : '';
  return '<div class="pitch-wrap"><div class="pitch">'+
    '<div class="pitch-line pitch-halfway"></div><div class="pitch-line pitch-circle"></div><div class="pitch-line pitch-box pitch-box-top"></div><div class="pitch-line pitch-box pitch-box-bottom"></div>'+
    jerseys+
  '</div>'+overflowNote+'</div>';
}
function lineupTeamCard(m,club,clubId){
  var count = matchLineup(m.id,clubId).length;
  var html = '<div class="card card-pad">';
  html += '<div class="lineup-col-head">'+crestHtml(club,30)+'<div><div class="section-title" style="font-size:14px">'+esc(clubName(clubId))+'</div><div class="eyebrow">'+count+' players</div></div></div>';
  html += '<div style="display:flex;justify-content:center;margin:8px 0 2px"><select class="select" style="min-height:30px;padding:4px 8px;font-size:12px;width:auto" data-action-select="set-formation" data-match-id="'+m.id+'" data-club-id="'+clubId+'">'+
    FORMATION_KEYS.map(function(k){return '<option value="'+k+'"'+(k===formationKeyFor(m,clubId)?" selected":"")+'>'+k+'</option>';}).join("")+
  '</select></div>';
  html += pitchFormation(m,clubId);
  html += '</div>';
  return html;
}
// Shared by the star toggle and the Player of Interest checkbox in the pitch-slot modal.
// Only stamps interestDate/interestScoutId and promotes the linked player out of pendingInterest
// on the false->true transition, so re-saving an already-interested player (e.g. just editing
// their notes) doesn't keep bumping the interest date.
function applyInterestFlag(mp,want){
  if(want && !mp.playerOfInterest){
    mp.interestDate = todayISO(); mp.interestScoutId = DB.currentScoutId;
    var promoted = playerById(mp.playerId);
    if(promoted && promoted.pendingInterest) promoted.pendingInterest = false;
    // New Players of Interest join the end of this match's preference order.
    var siblingRanks = matchPlayersOfInterest(mp.matchId).map(function(x){return x.interestRank||0;});
    mp.interestRank = siblingRanks.length ? Math.max.apply(null,siblingRanks)+1 : 1;
  }
  mp.playerOfInterest = want;
}
ACTIONS["toggle-interest"] = function(el){
  var mp = byId(DB.matchPlayers,el.dataset.id);
  if(!mp) return;
  applyInterestFlag(mp,!mp.playerOfInterest);
  if(el.hasAttribute("data-close-modal")) closeModal();
  persist({toast: mp.playerOfInterest ? "Marked as Player of Interest" : "Removed from Players of Interest"});
};
// Reorders this match's Players of Interest by preference (dir -1 = move up/liked more, +1 = move
// down/liked less), swapping ranks with the adjacent entry.
function movePlayerOfInterest(mpId,dir){
  var mp = byId(DB.matchPlayers,mpId);
  if(!mp) return;
  var list = matchPlayersOfInterest(mp.matchId);
  // Backfill sequential ranks for the WHOLE list first (in its current, already-correct display
  // order) before swapping. Entries added before this feature existed (or otherwise missing a
  // rank) all default to the same value, so giving a concrete rank to only the two being swapped
  // used to make them jump past every other still-unranked entry instead of moving one spot.
  list.forEach(function(x,i){ x.interestRank = i+1; });
  var idx = list.findIndex(function(x){return x.id===mpId;});
  var swapIdx = idx+dir;
  if(idx===-1 || swapIdx<0 || swapIdx>=list.length){ persist({}); return; }
  var other = list[swapIdx];
  var tmp = mp.interestRank; mp.interestRank = other.interestRank; other.interestRank = tmp;
  persist({});
}
ACTIONS["move-poi-up"] = function(el){ movePlayerOfInterest(el.dataset.id,-1); };
ACTIONS["move-poi-down"] = function(el){ movePlayerOfInterest(el.dataset.id,1); };
function playerHasOtherRecords(playerId,excludeMpId){
  if(DB.matchPlayers.some(function(x){return x.playerId===playerId && x.id!==excludeMpId;})) return true;
  if(DB.evaluations.some(function(x){return x.playerId===playerId;})) return true;
  if(DB.playerNotes.some(function(x){return x.playerId===playerId;})) return true;
  var p = playerById(playerId);
  if(!p) return false;
  // clubId, firstPosition and characteristics can be auto-filled just from being added to this lineup,
  // so they don't by themselves count as "already a record" — everything else does.
  var extraFields = [p.secondPosition,p.dob,p.birthYear,p.nationality,p.nationality2,p.preferredFoot,p.height,p.agent,p.photo,p.extraObservations,p.currentPerformance,p.currentPotential,p.status];
  return extraFields.some(function(v){ return v!==undefined && v!==null && String(v).trim()!==""; });
}
ACTIONS["remove-lineup-entry"] = function(el){
  var mpId = el.dataset.id;
  var mp = byId(DB.matchPlayers,mpId);
  var playerId = mp ? mp.playerId : null;
  DB.matchPlayers = DB.matchPlayers.filter(function(x){return x.id!==mpId;});
  var toast = "Removed from lineup";
  if(playerId && !playerHasOtherRecords(playerId,mpId)){
    DB.players = DB.players.filter(function(x){return x.id!==playerId;});
    toast = "Removed from lineup — no other records for this player, so it was deleted too";
  }
  if(el.hasAttribute("data-close-modal")) closeModal();
  persist({toast:toast});
};
INLINE_EDIT_HANDLERS["mp-interestNote"] = function(el,val){
  var mp = byId(DB.matchPlayers,el.dataset.id); if(!mp) return;
  mp.interestNote = val; persist({});
};

function createPlayerMinimal(name,clubId,characteristics,firstPosition){

/* ============================================================
   PITCH SLOT MINI-MODAL — tap a jersey to add/edit that player
   ============================================================ */
// Currently-active lineup entries for a club — a starter not yet subbed off, or a substitute
// already on the pitch who hasn't themselves been subbed off — used to populate "Substituted For".
function onPitchPlayers(matchId,clubId,excludeMpId){
  var all = matchLineup(matchId,clubId);
  var replacedIds = {};
  all.forEach(function(x){ if(x.replacedPlayerId) replacedIds[x.replacedPlayerId]=true; });
  return all.filter(function(x){ return x.id!==excludeMpId && !replacedIds[x.id]; });
}
// presetSub: {replacedMpId, subMinute} already collected by the "Add Substitute" mini-modal
// (openAddSubstituteIntroModal) — carried through as hidden fields so this modal doesn't need to
// show those fields again for a fresh substitute add. Editing an existing substitute later still
// shows them inline (there's no earlier mini-modal step to have collected them).
function openPitchSlotModal(matchId,clubId,slotIndex,mpId,forceStatus,presetSub){
  forceStatus = forceStatus || "Starting XI";
  var mForSlot = matchById(matchId);
  var slots = mForSlot ? formationFor(mForSlot,clubId) : FORMATIONS["4-3-3"];
  var slot = slots[slotIndex] || {pos:""};
  var mp = mpId ? byId(DB.matchPlayers,mpId) : null;
  var p = mp ? playerById(mp.playerId) : null;
  var isEdit = !!mp;
  var ev = mp ? DB.evaluations.find(function(e){return e.playerId===mp.playerId && e.matchId===matchId && e.evaluationType==="Match";}) : null;
  var title = isEdit ? "Edit Player" : (forceStatus==="Substitute" ? "Add Substitute" : "Add "+slot.pos);
  var showSubFields = isEdit && mp.lineupStatus==="Substitute";
  var html = '<div class="modal-pad"><div class="modal-head"><div class="modal-title">'+title+'</div>'+
    '<div style="display:flex;align-items:center;gap:14px"><button type="submit" form="pitchSlotForm" class="btn btn-primary btn-sm">Save</button><button class="icon-btn" data-close-modal>'+ic("close")+'</button></div>'+
  '</div>';
  html += '<form id="pitchSlotForm" data-form="save-pitch-slot" class="stack" data-match-id="'+matchId+'" data-club-id="'+clubId+'" data-slot="'+slotIndex+'" data-mp-id="'+(mpId||"")+'" data-force-status="'+forceStatus+'">';
  if(!showSubFields && forceStatus==="Substitute" && presetSub){
    html += '<input type="hidden" name="replacedMpId" value="'+escAttr(presetSub.replacedMpId||"")+'">';
    html += '<input type="hidden" name="subMinute" value="'+escAttr(presetSub.subMinute||"")+'">';
  }
  // Number+Name: stacked on desktop (.namenum-row), side by side only on a narrow/iPhone screen.
  html += '<div class="namenum-row"><div class="field"><label class="field-label">Number</label><input class="input" type="number" min="1" max="99" name="shirtNumber" value="'+escAttr(mp?mp.shirtNumber||"":"")+'" placeholder="#" autofocus></div>';
  if(isEdit){
    html += '<div class="field"><label class="field-label">Name</label><input class="input" name="name" value="'+escAttr(p?p.name:"")+'"></div>';
  } else {
    html += '<div class="field"><label class="field-label">Name <span class="opt">optional, "???" if unsure</span></label><div class="combo" data-combo-root="pitchSlotName">'+
      '<input type="hidden" name="playerId" id="pitchSlotName_hidden">'+
      '<input class="input" name="name" id="pitchSlotName_text" placeholder="Player name" autocomplete="off">'+
      '<div class="combo-list" id="pitchSlotName_list" hidden></div>'+
    '</div></div>';
  }
  html += '</div>';
  html += '<div class="field"><label class="field-label">Position</label><select class="select" name="position">'+positionOptions(mp?mp.position:slot.pos)+'</select></div>';
  if(showSubFields){
    var onPitch = onPitchPlayers(matchId,clubId,mp?mp.id:null);
    html += '<div class="form-grid">'+
      '<div class="field"><label class="field-label">Substituted For <span class="opt">optional — might not be the same slot</span></label><select class="select" name="replacedMpId"><option value="">—</option>'+
        onPitch.map(function(x){
          var xp = playerById(x.playerId);
          var label = (x.shirtNumber?"#"+x.shirtNumber+" ":"")+shortPlayerName(xp?xp.name:"")+(x.position?" ("+x.position+")":"");
          return '<option value="'+x.id+'"'+(mp&&mp.replacedPlayerId===x.id?" selected":"")+'>'+esc(label)+'</option>';
        }).join("")+
      '</select></div>'+
      '<div class="field"><label class="field-label">Sub Minute <span class="opt">optional</span></label><input class="input" type="number" min="0" max="130" name="subMinute" value="'+escAttr(mp?mp.subMinute||"":"")+'" placeholder="e.g. 63"></div>'+
    '</div>';
  }
  html += '<div class="form-grid">'+
    '<div class="field"><label class="field-label">Preferred Foot <span class="opt">optional</span></label><div class="pillgroup" data-name="foot"><input type="hidden" name="preferredFoot" value="'+escAttr(p?p.preferredFoot||"":"")+'">'+FEET.map(function(ft){return '<button type="button" class="pill-opt'+(p&&ft===p.preferredFoot?" on":"")+'" data-value="'+ft+'">'+ft+'</button>';}).join("")+'</div></div>'+
    '<div class="field"><label class="field-label">Height <span class="opt">optional — estimate ok, e.g. "175+-"</span></label><input class="input" name="height" value="'+escAttr(p?p.height||"":"")+'" placeholder="e.g. 178 or 175+-"></div>'+
  '</div>';
  html += '<div class="field"><label class="field-label">Characteristics <span class="opt">optional — what stood out in this match</span></label><textarea class="textarea" name="characteristics" placeholder="What stands out about their profile…">'+esc(ev?ev.characteristics||(mp?mp.matchCharacteristics||"":""):"")+'</textarea></div>';
  html += '<div class="field"><label class="field-label">Birth Year <span class="opt">optional</span></label><input class="input" name="birthYear" type="number" min="1970" max="'+(new Date().getFullYear())+'" placeholder="e.g. 2005" value="'+escAttr(p?p.birthYear||"":"")+'"></div>';
  html += '<div class="field"><label class="field-label">Nationality <span class="opt">optional</span></label>'+renderCountryCombo("pitchSlotNat","nationality",p?p.nationality||"":"","Search nationality…")+'</div>';
  html += '<div class="form-grid">'+
    '<div class="field"><label class="field-label">Performance <span class="opt">1–5, optional</span></label><div class="pillgroup" data-name="performance"><input type="hidden" name="performance" value="'+escAttr(ev?ev.performance||"":"")+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" class="pill-opt'+(ev&&String(n)===String(ev.performance)?" on":"")+'" data-value="'+n+'">'+n+'</button>';}).join("")+'</div></div>'+
    '<div class="field"><label class="field-label">Potential <span class="opt">A–E, optional</span></label><div class="pillgroup" data-name="potential"><input type="hidden" name="potential" value="'+escAttr(ev?ev.potential||"":"")+'">'+GRADE_LETTERS.map(function(g){return '<button type="button" class="pill-opt'+(ev&&g===normalizeGrade(ev.potential)?" on":"")+'" data-value="'+g+'">'+g+'</button>';}).join("")+'</div></div>'+
  '</div>';
  html += '<div class="field"><label class="field-label">Notes <span class="opt">optional</span></label><textarea class="textarea" name="notes" placeholder="Any notes about this player…">'+esc(mp?mp.interestNote||"":"")+'</textarea></div>';
  html += '<label class="field-checkbox"><input type="checkbox" name="playerOfInterest" value="1"'+(mp&&mp.playerOfInterest?" checked":"")+'>'+ic("star")+' <span>Player of Interest</span></label>';
  if(isEdit){
    html += '<button type="button" class="btn btn-danger btn-block" data-action="remove-lineup-entry" data-id="'+mp.id+'" data-close-modal style="margin-top:8px">'+ic("trash")+' Remove from Lineup</button>';
  }
  html += '</form></div>';
  openModal(html);
  if(!isEdit){ wirePlayerCombo("pitchSlotName"); }
  wireCountryCombo("pitchSlotNat");
}
ACTIONS["open-pitch-slot"] = function(el){
  openPitchSlotModal(el.dataset.matchId,el.dataset.clubId,parseInt(el.dataset.slot,10),el.dataset.mpId||null);
};
// Tapping a bench "+" first opens a small mini-modal to (optionally) record who came off and the
// minute, THEN proceeds straight to the regular player modal — which no longer shows those two
// fields itself for a fresh add, since they were just collected here.
function openAddSubstituteIntroModal(matchId,clubId,slotIndex){
  var onPitch = onPitchPlayers(matchId,clubId,null);
  var html = '<div class="modal-pad"><div class="modal-head"><div class="modal-title">Add Substitute</div><button class="icon-btn" data-close-modal>'+ic("close")+'</button></div>';
  html += '<form data-form="add-substitute-intro" class="stack" data-match-id="'+matchId+'" data-club-id="'+clubId+'" data-slot="'+slotIndex+'">';
  html += '<div class="field"><label class="field-label">Substituted For <span class="opt">optional — might not be the same slot</span></label><select class="select" name="replacedMpId"><option value="">—</option>'+
    onPitch.map(function(x){
      var xp = playerById(x.playerId);
      var label = (x.shirtNumber?"#"+x.shirtNumber+" ":"")+shortPlayerName(xp?xp.name:"")+(x.position?" ("+x.position+")":"");
      return '<option value="'+x.id+'">'+esc(label)+'</option>';
    }).join("")+
  '</select></div>';
  html += '<div class="field"><label class="field-label">Sub Minute <span class="opt">optional</span></label><input class="input" type="number" min="0" max="130" name="subMinute" placeholder="e.g. 63" autofocus></div>';
  html += '<button class="btn btn-primary btn-block" type="submit">Continue</button>';
  html += '</form></div>';
  openModal(html);
}
FORM_HANDLERS["add-substitute-intro"] = function(form){
  var fd = new FormData(form);
  var presetSub = { replacedMpId: fd.get("replacedMpId")||"", subMinute: fd.get("subMinute")||"" };
  var matchId = form.dataset.matchId, clubId = form.dataset.clubId, slotIndex = parseInt(form.dataset.slot,10);
  openPitchSlotModal(matchId,clubId,slotIndex,null,"Substitute",presetSub);
};
ACTIONS["open-pitch-slot-sub"] = function(el){
  openAddSubstituteIntroModal(el.dataset.matchId,el.dataset.clubId,parseInt(el.dataset.slot,10));
};
FORM_HANDLERS["save-pitch-slot"] = function(form){
  var fd = new FormData(form);
  var matchId = form.dataset.matchId, clubId = form.dataset.clubId;
  var slotIndex = parseInt(form.dataset.slot,10);
  var existingMpId = form.dataset.mpId;
  var forceStatus = form.dataset.forceStatus || "Starting XI";
  var shirtNumber = fd.get("shirtNumber")||"";
  var mForSlot = matchById(matchId);
  var slotsForSlot = mForSlot ? formationFor(mForSlot,clubId) : FORMATIONS["4-3-3"];
  var position = fd.get("position")||(slotsForSlot[slotIndex]?slotsForSlot[slotIndex].pos:"");
  var name = (fd.get("name")||"").trim();
  var birthYear = fd.get("birthYear")||"";
  var preferredFoot = fd.get("preferredFoot")||"";
  var height = (fd.get("height")||"").trim();
  var performance = fd.get("performance")||"";
  var potential = fd.get("potential")||"";
  var characteristics = fd.get("characteristics")||"";
  var notes = fd.get("notes")||"";
  var nationality = (fd.get("nationality")||"").trim();
  var replacedMpId = fd.get("replacedMpId")||"";
  var subMinute = fd.get("subMinute")||"";
  var wantInterest = fd.get("playerOfInterest")==="1";
  function applyBrief(playerId){
    var pl = playerById(playerId);
    if(pl){
      // fill-if-missing for birth year/foot/nationality: don't clobber info the player profile
      // already has. Height and Position are different — a young player's height and best-fit
      // role can change match to match, so they always track whichever dated entry is most
      // recent, never letting an older match's info overwrite a newer one (see applyLatestPlayerField).
      if(birthYear && !pl.birthYear) pl.birthYear = birthYear;
      if(preferredFoot && !pl.preferredFoot) pl.preferredFoot = preferredFoot;
      if(nationality && !pl.nationality) pl.nationality = nationality;
      var srcDate = (mForSlot && mForSlot.date) || todayISO();
      applyLatestPlayerField(pl,"height","heightUpdatedAt",height,srcDate);
      applyLatestPlayerField(pl,"firstPosition","positionUpdatedAt",position,srcDate);
      pl.updatedAt = nowISO();
    }
    if(performance || potential || characteristics.trim()){ upsertMatchEvaluation(playerId,matchId,{performance:performance,potential:potential,characteristics:characteristics}); }
  }
  if(existingMpId){
    var mp = byId(DB.matchPlayers,existingMpId);
    if(!mp) return;
    var p = playerById(mp.playerId);
    if(p && name && name!==p.name){ p.name = name; p.updatedAt = nowISO(); }
    mp.shirtNumber = shirtNumber;
    mp.position = position;
    mp.matchCharacteristics = characteristics;
    mp.interestNote = notes;
    mp.replacedPlayerId = replacedMpId;
    mp.subMinute = subMinute;
    applyInterestFlag(mp,wantInterest);
    applyBrief(mp.playerId);
    closeModal();
    persist({toast:"Player updated"});
    return;
  }
  var playerId = fd.get("playerId")||"";
  function finalize(pid,isNewPlayer){
    var mpNew = {
      id:uid("mp"), matchId:matchId, playerId:pid, clubId:clubId,
      shirtNumber:shirtNumber, position:position, slotIndex:slotIndex,
      lineupStatus:forceStatus, matchCharacteristics:characteristics,
      playerOfInterest:false, interestNote:notes, interestPriority:"",
      replacedPlayerId:replacedMpId, subMinute:subMinute, createdAt:nowISO()
    };
    DB.matchPlayers.push(mpNew);
    applyInterestFlag(mpNew,wantInterest);
    applyBrief(pid);
    closeModal();
    persist({toast: isNewPlayer ? "New player created and added to lineup" : "Player added to lineup"});
  }
  if(playerId){ finalize(playerId,false); return; }
  if(!name){
    var npBlank = createPlayerMinimal("???",clubId,"",position);
    finalize(npBlank.id,true);
    return;
  }
  var candidates = findPlayerCandidates(name,clubId,null,null);
  if(candidates.length){
    openDuplicateModal(candidates,function(res){
      if(res.type==="existing"){ finalize(res.playerId,false); }
      else { var np = createPlayerMinimal(name,clubId,"",position); finalize(np.id,true); }
    });
  } else {
    var np2 = createPlayerMinimal(name,clubId,"",position);
    finalize(np2.id,true);
  }
};

/* ============================================================
   INIT
   ============================================================ */
// One-time cleanup for data saved before the "pending interest" rule existed: a player added
// from a match lineup, never marked as a Player of Interest anywhere, and never manually
// developed beyond that (no characteristics/agent/photo/status/observations added) is retroactively
// hidden from the Players Database, matching what would happen if they were added today. Players
// created after this rule shipped already carry an explicit pendingInterest flag, so this only
// ever touches genuinely old, untouched records — it never runs twice on the same player.
function migrateLegacyPendingInterest(){
  DB.players.forEach(function(p){
    if(p.pendingInterest !== undefined) return;
    var lineups = DB.matchPlayers.filter(function(mp){ return mp.playerId===p.id; });
    if(!lineups.length) return;
    if(lineups.some(function(mp){ return mp.playerOfInterest; })) return;
    var untouched = !p.characteristics && !p.agent && !p.photo && !p.status && !p.extraObservations;
    if(untouched) p.pendingInterest = true;
  });
}
async function init(){
  bindGlobalEvents();
  DB = await loadInitialData();
  migrateLegacyPendingInterest();
  ROUTE = parseHash();
  render();
  startBackgroundSync();
}
init();

  window.addEventListener("load",function(){
    navigator.serviceWorker.register("/sw.js").catch(function(e){ console.warn("MF Base: service worker registration failed",e); });
  });
}
